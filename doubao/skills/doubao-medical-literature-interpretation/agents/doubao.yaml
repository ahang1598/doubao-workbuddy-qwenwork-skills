interface:
  display_name: "医学文献解读"
  short_description: "充分解读医学领域文献，或生成飞书完整解读"
  default_prompt: >-
    使用 $doubao-medical-literature-interpretation 解读用户指定的一篇医学论文、指南、共识或片段。用户明确要求 PPT、幻灯片、课件或演示文稿时，直接调用 lark-ppt。response_mode 只用于 quick_answer 和 full_report 的内部路由，用户可见回复不得出现内部模式名，也不复述 Skill 内部要求、模板、校验流程或模式判断过程。用户主动选择或点名本 Skill，或只说“解读、介绍、看看这篇”且已有可用全文时，直接走 full_report；深入解读、完整报告、创建文档和文献讨论也走 full_report。只有用户明确要求总结、概括、回答文章内问题、不要文档，或仅提供短内容且没有主动选择本 Skill、没有要求完整解读时，才在聊天内直接充分回答。模式只判定一次，确定后执行到底，不再反复比较或切换；来源不足只影响能否完成当前模式，不重新选择模式。聊天回答的丰富度、篇幅和细节服从文章复杂度与用户问题，可使用内容型小标题、自然段、列表、加粗和合适的 Markdown 表格，并自然询问是否需要基于全文生成图文完整解读。生成完整报告时先识别文献类型、原文结构和用户关注点，再自由设计飞书文档，用一个独立 h1 主章节承载原文详细解读，内部自由组织 h2/h3 并连续编号，包含全局导读白板和重点内容白板，图表前先写解释性正文。本地文件使用 read，web.fetch 仅用于 http(s)，固定上下标写 Unicode。飞书完整解读后可自然询问是否进一步调研相关文献；未经用户确认不自动启动。

policy:
  allow_implicit_invocation: true
