  <title>直播复盘报告</title>
  <style>
    :root {

    }

      function normalizeDimensionScores(reviewScore) {

          return arrayScores.map(item => {
            const normalized = {
              title: dimensionLabel(firstText(item.dimension_code, item.DimensionCode, item.name, item.Name)),
              score: firstNumber(item.score, item.Score),
              industryAvgScore: firstNumber(item.industry_avg_score, item.AvgIndustryScore, item.avg_industry_score),
              evaluation: firstText(item.evaluation, item.Evaluation, item.summary, item.Summary, item.detail, item.Detail, "--")
            };
            normalized.status_label = dimensionStatusLabel(Object.assign({}, item, normalized));
            normalized.suggestions = normalizeDimensionActionSuggestions(item, normalized.title);
            return normalized;
          });
        }
        const objectScores = reviewScore.DimensionScores || reviewScore.dimension_scores || {};
        return Object.keys(objectScores).map(key => {
          const item = objectScores[key] || {};

            title: dimensionLabel(key),
            score: firstNumber(item.score, item.Score),

      function normalizeDimensionActionSuggestions(item, dimension) {
        const sources = []

          .concat(normalizeMaybeArray(item.suggestions || item.Suggestions))

        return sources.map(action => ({
          dimension: dimension,
          title: firstText(action.suggestion_title, action.SuggestionTitle, action.title, action.Title, ""),
          content: firstText(action.content, action.Content, action.detail, action.Detail, "")
        })).filter(action => action.title || action.content);

      function normalizeActionSuggestions(actionPlan) {

      function radarPoint(row, index, total, radius, center, valueKey) {
        const angle = -Math.PI / 2 + index * Math.PI * 2 / total;
        const value = Math.max(0, Math.min(100, Number(row[valueKey]) || 0));
        const r = radius * value / 100;
        return {
          x: center + Math.cos(angle) * r,
          y: center + Math.sin(angle) * r,
          angle: angle,
          value: value
        };
      }

      function radarLabelPoint(index, total, radius, center) {
        const angle = -Math.PI / 2 + index * Math.PI * 2 / total;

      }

            return point.x.toFixed(1) + "," + point.y.toFixed(1);
          }).join(" ");
        });
        const livePoints = rows.map((row, index) => radarPoint(row, index, total, radius, center, "score"));

      function metricNumber(value) {
        if (typeof value === "number") return value;

        return Number.isFinite(parsed) ? parsed : NaN;
      }

      function formatDuration(totalSeconds) {
        const seconds = Math.max(0, Math.round(Number(totalSeconds) || 0));
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return [h, m, s].map(part => String(part).padStart(2, "0")).join(":");
      }

      function segmentMomentType(seg) {
        const labels = collectSegmentLabels(seg);
        if (labels.indexOf("问题时刻") >= 0 || labels.indexOf("4") >= 0 || String(seg.tag_code || seg.TagCode || "") === "4") return "problem";
        if (labels.indexOf("违规片段") >= 0 || labels.indexOf("3") >= 0 || String(seg.tag_code || seg.TagCode || "") === "3") return "violation";
        if (labels.indexOf("高光时刻") >= 0 || labels.indexOf("2") >= 0 || String(seg.tag_code || seg.TagCode || "") === "2") return "highlight";
        return "";
      }

      function segmentMomentReason(seg, type) {
        const reasons = seg.label_reasons || seg.LabelReasons || {};
        return type === "problem"
          ? firstText(reasons["4"], reasons[4], seg.problem_reason, seg.ProblemReason, seg.analysis, seg.Analysis, seg.summary, seg.Summary, "")
          : firstText(reasons["2"], reasons[2], seg.highlight_reason, seg.HighlightReason, seg.analysis, seg.Analysis, seg.summary, seg.Summary, "");
      }

      function collectContentMomentEvents(content, modules, nearestIndex) {
        const contentSegments = safeArray(content && content.segments);
        const moduleSegments = safeArray(modules && modules.content_analysis && modules.content_analysis.semantic_segments);
        const segments = contentSegments.length ? contentSegments : moduleSegments;
        return segments.map(function (seg) {
          const type = segmentMomentType(seg);
          if (!type) return null;
          const start = nearestIndex(firstNumber(seg.start_time, seg.StartTime, seg.start_ms, seg.StartMS));
          const end = nearestIndex(firstNumber(seg.end_time, seg.EndTime, seg.end_ms, seg.EndMS));
          if (start < 0 || end < 0) return null;
          return {
            start: Math.min(start, end),
            end: Math.max(start, end),
            type: type,
            title: firstText(seg.title, seg.Title, type === "problem" ? "问题时刻" : type === "violation" ? "违规片段" : "高光时刻"),
            reason: segmentMomentReason(seg, type)
          };
        }).filter(Boolean);
      }

      function collectContentProductEvents(content, modules, nearestIndex) {
        const contentSegments = safeArray(content && content.segments);
        const moduleSegments = safeArray(modules && modules.content_analysis && modules.content_analysis.semantic_segments);
        const segments = contentSegments.length ? contentSegments : moduleSegments;
        return segments.map(function (seg) {
          const labels = segmentLabelSet(seg);
          if (!labels["商品讲解"] && !labels["1"]) return null;
          const start = nearestIndex(firstNumber(seg.start_time, seg.StartTime, seg.start_ms, seg.StartMS));
          const end = nearestIndex(firstNumber(seg.end_time, seg.EndTime, seg.end_ms, seg.EndMS));
          if (start < 0 || end < 0) return null;
          return {
            start: Math.min(start, end),
            end: Math.max(start, end),
            payload: {
              Kind: "product_segment",
              Title: firstText(seg.title, seg.Title, seg.tag, seg.Tag, "商品讲解"),
              Summary: firstText(seg.summary, seg.Summary, seg.analysis, seg.Analysis, ""),
              StartTime: firstNumber(seg.start_time, seg.StartTime, seg.start_ms, seg.StartMS),
              EndTime: firstNumber(seg.end_time, seg.EndTime, seg.end_ms, seg.EndMS)
            }
          };
        }).filter(Boolean);
      }

      function collectLegacyHighlightEvents(highlightsData, nearestIndex) {
        return highlightsData.map(function (highlight) {
          const start = nearestIndex(highlight.StartTime);
          const end = nearestIndex(highlight.EndTime);
          if (start < 0 || end < 0) return null;
          const rawType = Number(highlight.Type);
          return {
            start: Math.min(start, end),
            end: Math.max(start, end),
            type: rawType === 2 || rawType === 4 ? "problem" : "highlight",
            title: firstText(highlight.Title, rawType === 2 || rawType === 4 ? "问题时刻" : "高光时刻"),
            reason: firstText(highlight.Reason, highlight.Summary, ""),
            image: firstText(safeArray(highlight.FrameImages)[0], "")
          };
        }).filter(Boolean);
      }

      function normalizeMomentEvents(content, modules, highlightsData, nearestIndex) {
        const contentMoments = collectContentMomentEvents(content, modules, nearestIndex);
        if (contentMoments.length) return contentMoments;
        return collectLegacyHighlightEvents(highlightsData, nearestIndex);
      }

      function nearestSlotEvent(slotIndex, events, isRange) {
        const rows = safeArray(events);
        if (!rows.length) return null;
        if (isRange) {
          const matched = rows.find(event => slotIndex >= Number(event.start || 0) && slotIndex <= Number(event.end || event.start || 0));
          if (matched) return matched;
        } else {
          const exact = rows.find(event => Number(event.index) === Number(slotIndex));
          if (exact) return exact;
        }
        return rows.reduce((best, event) => {
          const target = isRange ? Number(event.start || 0) : Number(event.index || 0);
          const bestTarget = isRange ? Number(best.start || 0) : Number(best.index || 0);
          return Math.abs(target - slotIndex) < Math.abs(bestTarget - slotIndex) ? event : best;
        }, rows[0]);
      }

      function chartTooltipShell(body, minWidth) {
        return '<div class="chart-tooltip-card" style="min-width:' + (minWidth || 220) + 'px;padding:16px 18px;border-radius:16px;background:#fff;box-shadow:0 16px 42px rgba(31,35,41,0.16);border:1px solid rgba(234,237,241,0.9);color:#737A87;font-size:13px;line-height:20px;">' + body + '</div>';
      }

      function chartTooltipPosition(pos, params, dom) {
        if (!dom) return pos;
        const seriesName = Array.isArray(params) ? firstText(params[0] && params[0].seriesName, "") : firstText(params.seriesName, "");
        const isHoverItem = seriesName === "互动" || seriesName === "商品";
        const isMomentItem = seriesName === "时刻" || seriesName === "slot-hover-moment";
        const offsetHalfWidth = dom.offsetWidth / 2;
        const offsetHeight = isHoverItem || isMomentItem ? dom.offsetHeight : dom.offsetHeight / 2;
        const momentLift = isMomentItem ? 96 : 10;
        const tooltipY = Math.max(8, pos[1] - offsetHeight - momentLift);
        const chartWidth = 994;
        if (pos[0] > chartWidth - dom.offsetWidth && !isHoverItem) {
          return [pos[0] - dom.offsetWidth - 10, tooltipY];
        }
        return [pos[0] + (isHoverItem ? -offsetHalfWidth : 10), tooltipY];
      }

      function chartLineTooltipHtml(params, seriesConfig) {

      function chartInteractionLabels(type, joinCount, winCount) {
        const value = Number(type);
        let countLabel = "点击次数";

        let secondValue = "";
        if (value === 2) countLabel = "签到次数";
        if ([3, 4, 6, 7, 8, 9].indexOf(value) >= 0) countLabel = "参与人数";
        if (value === 5) countLabel = "领取数量";

          + '<div class="chart-pop-card-content">'

          + '<div class="chart-pop-card-info">'
          + '<div class="chart-pop-card-title" title="' + escapeHtml(firstText(item.title, "")) + '">' + escapeHtml(firstText(item.title, typeLabel)) + '</div>'
          + '<div class="chart-pop-card-count">' + escapeHtml(countLabel) + ': ' + escapeHtml(countValue) + '</div>'
          + (secondInfo ? '<div class="chart-pop-card-price">' + escapeHtml(secondInfo) + '</div>' : '')
          + (item.highlight ? '<div><span class="chart-pop-card-highlight">' + escapeHtml(item.highlight) + '</span>' + (item.strikethrough ? '<span class="chart-pop-card-strike">' + escapeHtml(item.strikethrough) + '</span>' : '') + '</div>' : '')
          + '</div></div></div>';

      function chartEventsAtSameIndex(events, slotIndex) {
        return safeArray(events).filter(event => Number(event.index) === Number(slotIndex));

      function parseTimeLabelSeconds(label) {
        const parts = String(label || "").split(":").map(part => Number(part || 0));
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        return Number(parts[0] || 0);
      }

      function formatDurationZh(seconds) {
        const total = Math.max(0, Math.round(Number(seconds) || 0));
        const minutes = Math.floor(total / 60);
        const remain = total % 60;
        return minutes ? minutes + "分" + String(remain).padStart(2, "0") + "秒" : remain + "秒";
      }

      function momentRangeText(event, timeData) {
        return firstText(timeData && timeData[event.start], "--") + "~" + firstText(timeData && timeData[event.end], timeData && timeData[event.start], "--");
      }

      function momentDurationText(event, timeData) {
        const start = parseTimeLabelSeconds(timeData && timeData[event.start]);
        const end = parseTimeLabelSeconds(timeData && timeData[event.end]);
        return formatDurationZh(Math.max(0, end - start));
      }

      function chartSlotTooltipHtml(kind, event, timeLabel, timeData) {

            }, timeLabel, 0);

      function LiveChart(props) {
        if (props.enabled === false) return null;
        const chartRef = React.useRef(null);
        const chartInsRef = React.useRef(null);
        const lineRows = React.useMemo(() => normalizeLineData(props.lineData, props.curve), [props.lineData, props.curve]);

        React.useEffect(() => {
          if (!chartRef.current || !window.echarts || !lineRows.length) return undefined;
          if (!chartInsRef.current) chartInsRef.current = echarts.init(chartRef.current);

          const startTimestamp = Number(lineRows[0].TimeStamp || 0);
          const timeData = lineRows.map(item => formatRelativeTime(normalizeChartOffsetSeconds(item.TimeStamp, startTimestamp)));
          const baseStartTime = Number(props.baseStartTime || startTimestamp || 0);
          const interactionData = normalizeInteractionData(props.interactionData);
          const productData = safeArray(interactionData.Products);
          const interactionToolsData = safeArray(interactionData.InteractTools);
          const highlightsData = safeArray(props.highlightsData && props.highlightsData.Highlights);
          const nearestIndex = function (sendTime) {
            if (!lineRows.length) return -1;
            const rawTime = Number(sendTime || 0);
            const absoluteTime = rawTime > startTimestamp ? rawTime : baseStartTime + rawTime;
            let bestIndex = 0;
            let bestDistance = Math.abs(Number(lineRows[0].TimeStamp || 0) - absoluteTime);
            lineRows.forEach(function (row, index) {
              const distance = Math.abs(Number(row.TimeStamp || 0) - absoluteTime);
              if (distance < bestDistance) {
                bestDistance = distance;
                bestIndex = index;
              }
            });
            return bestIndex;
          };
          const productCardEvents = productData.map(product => {
            const index = nearestIndex(product.SendTime);
            return { index: index, start: index, end: index, payload: product };
          }).filter(event => event.index >= 0);
          const productSegmentEvents = collectContentProductEvents(props.content, props.modules, nearestIndex);
          const productEvents = productSegmentEvents.length ? productSegmentEvents : productCardEvents;
          const interactionEvents = interactionToolsData.map(interaction => ({ index: nearestIndex(interaction.SendTime), payload: interaction })).filter(event => event.index >= 0);
          const momentEvents = props.showHighlights === false ? [] : normalizeMomentEvents(props.content, props.modules, highlightsData, nearestIndex);
          const seriesConfig = [
            { name: "在线人数", data: lineRows.map(item => Number(item.OnlineUV || 0)), color: "#1664FF", markPointLabel: "最大在线人数" },
            { name: "进场人数", data: lineRows.map(item => Number(item.EnterUV || 0)), color: "#009488", markPointLabel: "最大进场人数" },
            { name: "访问人数", data: lineRows.map(item => Number(item.ViewUV || 0)), color: "#FF8A00", markPointLabel: "最大访问人数" },
            { name: "邀请人数", data: lineRows.map(item => Number(item.InviteUV || 0)), color: "#00B42A", markPointLabel: "最大邀请人数" },
            { name: "点赞次数", data: lineRows.map(item => Number(item.ThumbUpCount || 0)), color: "#F53F3F", markPointLabel: "最大点赞次数" },
            { name: "聊天次数", data: lineRows.map(item => Number(item.CommentCount || 0)), color: "#722ED1", markPointLabel: "最大聊天次数" },

      function tagClass(tag) {
        if (tag === "商品讲解" || tag === "车型讲解") return "blue";
        if (tag === "高光时刻") return "green";
        if (tag === "违规片段") return "red";
        if (tag === "问题时刻") return "red";
        return "";
      }

      function renderSegmentTag(tag, detailControl) {
        const kind = tagClass(tag);
        const children = detailControl ? [tag, detailControl] : [tag];
        if (kind === "blue") return e("span", { className: "tag blue", key: tag }, children);
        if (kind === "green") return e("span", { className: "tag green", key: tag }, children);
        if (kind === "red") return e("span", { className: "tag red", key: tag }, children);
        return e("span", { className: "tag", key: tag }, children);
      }

      function segmentLabelName(label) {
        const value = String(label);
        if (value === "1") return "商品讲解";
        if (value === "2") return "高光时刻";
        if (value === "3") return "违规片段";
        if (value === "4") return "问题时刻";
        return value;
      }

      function rawSegmentProducts(seg) {
        return normalizeMaybeArray(seg.related_products || seg.RelatedProducts || seg.products || seg.Products)
          .concat(safeArray(seg.ProductNameList || seg.product_name_list));
      }

      function segmentHasRealProduct(seg) {
        return rawSegmentProducts(seg).some(product => {
          const title = typeof product === "string"
            ? product
            : firstText(product.title, product.Title, product.name, product.Name, product.product_name, product.ProductName, "");
          return !!title && title !== "商品" && title !== "产品";
        });
      }

      function segmentProductEvidenceText(seg) {
        return [
          firstText(seg.title, seg.Title, ""),
          firstText(seg.summary, seg.Summary, ""),
          firstText(seg.text, seg.Text, seg.content, seg.Content, "")
        ].join(" ");
      }

      function segmentHasProductEvidence(seg) {
        if (segmentHasRealProduct(seg)) return true;
        const text = segmentProductEvidenceText(seg);
        const productObjects = ["这款", "这件", "这一盒", "每一盒", "包装", "代言人", "海参原浆", "海参滴丸", "海参胶囊", "冻干粉", "牡蛎", "酶解"];
        const productInfo = ["价格", "多少钱", "优惠", "福利", "买一送一", "送双", "名额", "购买", "下单", "链接", "规格", "原料", "成分", "营养", "功效", "适用", "服用", "使用", "吃法", "工艺", "技术", "脱腥", "售后", "质保"];
        return hasAnyTerm(text, productObjects) && hasAnyTerm(text, productInfo);
      }

      function fallbackSegmentTag(seg) {
        const text = segmentProductEvidenceText(seg);
        if (hasAnyTerm(text, ["访谈", "采访", "董事长", "创始人", "企业", "央视", "媒体", "荣誉", "认可", "背书"])) return "品牌背书";
        if (hasAnyTerm(text, ["欢迎", "互动", "评论", "点赞", "签到", "公屏"])) return "互动承接";
        return "内容讲解";
      }

      function collectSegmentLabels(seg) {
        const displayLabels = safeArray(seg.display_labels || seg.DisplayLabels);
        if (displayLabels.length) return displayLabels.concat(displayLabels.map(String));
        const tags = safeArray(seg.tags || seg.Tags);
        const labels = safeArray(seg.labels || seg.Labels);
        const tagCode = firstText(seg.tag_code, seg.TagCode, "");
        const primaryTag = firstText(seg.tag, seg.Tag, tagCode ? segmentLabelName(tagCode) : "", tags[0], "");
        const collected = (primaryTag ? [primaryTag] : []).concat(tags).concat(labels.map(segmentLabelName)).concat(labels.map(String));
        const normalized = uniqueSegmentLabels(collected);
        if ((normalized.indexOf("商品讲解") >= 0 || normalized.indexOf("1") >= 0) && !segmentHasProductEvidence(seg)) {
          const corrected = normalized.filter(label => label !== "商品讲解" && label !== "1");
          return corrected.length ? corrected : [fallbackSegmentTag(seg)];
        }
        return collected;
      }

      function uniqueSegmentLabels(labels) {
        const seen = {};
        return safeArray(labels).map(label => segmentLabelName(label)).filter(label => {
          const key = String(label || "");
          if (!key || seen[key]) return false;
          seen[key] = true;
          return true;
        });
      }

      function isMomentLabel(label) {
        return label === "高光时刻" || label === "违规片段" || label === "问题时刻";
      }

      function visibleSegmentLabels(labels) {
        const normalized = uniqueSegmentLabels(labels);
        const moments = normalized.filter(isMomentLabel);
        const rest = normalized.filter(label => !isMomentLabel(label));
        if (!moments.length) return normalized.slice(0, 4);
        if (!rest.length) return moments.slice(0, 4);
        return [rest[0]].concat(moments).concat(rest.slice(1)).slice(0, 4);
      }

      function segmentLabelSet(seg) {
        return uniqueSegmentLabels(collectSegmentLabels(seg)).reduce((set, label) => {
          set[String(label)] = true;
          return set;
        }, {});
      }

      function hasMomentDetail(seg) {
        const labels = segmentLabelSet(seg);
        return !!(labels["高光时刻"] || labels["2"] || labels["违规片段"] || labels["3"] || labels["问题时刻"] || labels["4"]);
      }

      function momentDetailTitle(seg) {
        const detail = seg.moment_detail || seg.MomentDetail || {};
        if (firstText(detail.heading, detail.Heading, "")) return firstText(detail.heading, detail.Heading);
        const labels = segmentLabelSet(seg);
        if (labels["问题时刻"] || labels["4"]) return "问题时刻详情";
        if (labels["违规片段"] || labels["3"]) return "违规片段详情";
        return "高光时刻详情";
      }

      function momentDetailBody(seg) {
        const detail = seg.moment_detail || seg.MomentDetail || {};
        const momentData = seg.momentData || seg.moment_data || seg.MomentData || {};
        if (firstText(detail.reason, detail.Reason, detail.body, detail.Body, detail.content, detail.Content, "")) return firstText(detail.reason, detail.Reason, detail.body, detail.Body, detail.content, detail.Content);
        const reasons = seg.label_reasons || seg.LabelReasons || {};
        const labels = segmentLabelSet(seg);
        const reason = labels["问题时刻"] || labels["4"]
          ? firstText(reasons["4"], reasons[4], seg.problem_reason, seg.ProblemReason, "")
          : labels["违规片段"] || labels["3"]
          ? firstText(reasons["3"], reasons[3], seg.violation_reason, seg.ViolationReason, "")
          : firstText(reasons["2"], reasons[2], seg.highlight_reason, seg.HighlightReason, "");
        return firstText(reason, momentData.reason, momentData.Reason, seg.analysis, seg.Analysis, seg.summary, seg.Summary, "");
      }

      function momentDetailSuggestion(seg) {
        const detail = seg.moment_detail || seg.MomentDetail || {};
        const momentData = seg.momentData || seg.moment_data || seg.MomentData || {};
        return firstText(detail.suggestion, detail.Suggestion, momentData.suggestion, momentData.Suggestion, seg.suggestion, seg.Suggestion, "");
      }

      function renderMomentDetail(seg) {
        const detail = seg.moment_detail || seg.MomentDetail || {};
        const labels = segmentLabelSet(seg);
        const problem = !!(labels["问题时刻"] || labels["4"] || labels["违规片段"] || labels["3"]);
        const body = momentDetailBody(seg);
        const suggestion = momentDetailSuggestion(seg);
        const detailTitle = firstText(detail.title, detail.Title, "");
        const heading = momentDetailTitle(seg) + (detailTitle ? "：" + detailTitle : "");
        return e("div", { className: "moment-detail" },
          e("p", { className: "moment-detail-title" }, heading),
          e("p", null, body ? (problem ? "问题说明：" : "高光说明：") + body : "该片段被标记为重点时刻，可结合原话、评论热词和曲线变化进一步复盘。"),
          suggestion ? e("p", { className: "moment-detail-suggestion" }, (problem ? "优化建议：" : "复用建议：") + suggestion) : null
        );
      }

      function renderMomentImages(seg) {
        const images = safeArray(seg.frame_images || seg.FrameImages).map(function (item) {
          return firstText(typeof item === "string" ? item : item && (item.url || item.URL || item.ImageURL), "");
        }).filter(Boolean).slice(0, 4);
        if (!images.length) return null;
        return e("div", { className: "moment-frame-images", "aria-label": "时刻截图" }, images.map(function (url, index) {
          return e("a", { href: url, target: "_blank", rel: "noopener noreferrer", key: url + index },
            e("img", { className: "moment-frame-image", src: url, alt: "问题时刻截图 " + (index + 1), loading: "lazy", referrerPolicy: "no-referrer" })
          );
        }));
      }

      function interactionKind(value, title) {
        const raw = String(value || "").toLowerCase();
        const text = String(title || "");
        if (raw === "1" || raw.indexOf("product") >= 0 || text.indexOf("商品") >= 0) return "product";
        if (raw.indexOf("coupon") >= 0 || text.indexOf("券") >= 0 || text.indexOf("优惠") >= 0 || text.indexOf("卡券") >= 0) return "coupon";
        if (raw.indexOf("red") >= 0 || text.indexOf("红包") >= 0) return "red_packet";
        if (raw === "2" || raw.indexOf("lottery") >= 0 || raw.indexOf("award") >= 0 || text.indexOf("抽奖") >= 0) return "lottery";
        return "interaction";
      }

      function interactionIcon(kind) {
        if (kind === "product") return "商";
        if (kind === "coupon") return "券";
        if (kind === "lottery") return "奖";
        if (kind === "red_packet") return "包";
        return "互";
      }

      function addInteractionRef(items, seen, kind, title) {
        const name = firstText(title, kind === "product" ? "商品讲解" : "互动");
        const key = kind + ":" + name;
        if (seen[key]) return;
        seen[key] = true;
        items.push({ kind: kind, title: name });
      }

      function normalizeSegmentInteractions(seg) {
        const display = safeArray(seg.interactions_display || seg.InteractionsDisplay);
        if (display.length) return display.slice(0, 6);
        const items = [];
        const seen = {};
        safeArray(seg.interactions || seg.Interactions || seg.InteractionRefs || seg.interaction_refs).forEach(interaction => {
          const title = typeof interaction === "string" ? interaction : firstText(interaction.title, interaction.Title, interaction.name, interaction.Name);
          const type = typeof interaction === "string" ? "" : firstText(interaction.kind, interaction.Kind, interaction.type, interaction.Type, interaction.event_type, interaction.EventType);
          const kind = interactionKind(type, title);
          if (kind !== "product") addInteractionRef(items, seen, kind, title);
        });
        safeArray(seg.InteractiveNameList || seg.interactive_name_list).forEach(title => {
          addInteractionRef(items, seen, interactionKind("", title), title);
        });
        return items.slice(0, 6);
      }

      function defaultProductImage() {
        return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent('<svg width="224" height="176" viewBox="0 0 224 176" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="224" height="176" rx="20" fill="#F3F6FB"/><rect x="54" y="42" width="116" height="92" rx="16" fill="#E6ECF5"/><path d="M82 118L102 94L119 110L133 88L153 118H82Z" fill="#C7D2E3"/><circle cx="93" cy="72" r="10" fill="#B8C4D6"/><text x="112" y="151" text-anchor="middle" font-size="20" fill="#737A87" font-family="Arial, sans-serif">商品</text></svg>');
      }

      function collectSegmentProducts(seg, automotive) {
        const display = safeArray(seg.products_display || seg.ProductsDisplay);
        if (display.length && !automotive) return display.slice(0, 4);
        const products = [];
        const addProduct = product => {
          const isText = typeof product === "string";
          const title = isText ? product : firstText(product.title, product.Title, product.name, product.Name, product.product_name, product.ProductName, "商品");
          const image = isText ? "" : firstText(product.image, product.Image, product.image_url, product.ImageUrl, product.cover_url, product.CoverUrl, product.pic_url, product.PicUrl, "");
          const meta = isText ? "" : firstText(product.price_text, product.PriceText, product.price, product.Price, product.click_text, product.ClickText, "");
          if (!automotive || image) products.push({ title: title, image: image || defaultProductImage(), meta: meta });
        };
        rawSegmentProducts(seg).forEach(addProduct);
        if (!products.length) {
          const labels = segmentLabelSet(seg);
          if (!automotive && (labels["商品讲解"] || labels["1"]) && segmentHasProductEvidence(seg)) products.push({ title: "商品", image: defaultProductImage(), placeholder: true });
        }
	        return products.slice(0, 4);
	      }

      function normalizeCommentWord(word) {
        return String(word || "").replace(/～/g, "~").replace(/\s+/g, " ").trim();
      }

      function hasAnyTerm(text, terms) {
        return terms.some(term => text.indexOf(term) >= 0);
      }

      function isBracketEmojiOnly(text) {
        if (!text || text.indexOf("[") < 0 || text.indexOf("]") < 0) return false;
        const stripped = text.replace(/\[[^\]]+\]/g, "").replace(/[~!！,，.。\s]/g, "");
        return stripped === "";
      }

      function commentWordValue(word) {
        const text = normalizeCommentWord(word);
        const high = ["多少钱", "价格", "怎么买", "购买", "下单", "链接", "优惠", "福利", "名额", "库存", "有货", "声音", "信号", "卡", "看不清", "听不清", "贵", "不信", "能不能", "可以吃", "痛风", "甲亢", "海参", "原浆", "买一送一", "送双不送单", "1660", "500个名额"];
        const medium = ["合理", "理解", "感谢", "大气", "好产品", "好用", "要要要", "我要", "报名"];
        const low = ["早上好", "上午好", "晚上好", "老师好", "主播好", "赵总好", "欢迎", "欢迊", "签到", "打卡", "立即参与", "分钟到了", "666", "点赞", "赞"];
        if (hasAnyTerm(text, high)) return 2;
        if (hasAnyTerm(text, medium)) return 1;
        if (hasAnyTerm(text, low)) return -1;
        return 0;
      }

      function isLowValueCommentWord(word) {
        const text = normalizeCommentWord(word);
        if (!text) return true;
        if (commentWordValue(text) > 0) return false;
        if (commentWordValue(text) < 0) return true;
        if (isBracketEmojiOnly(text)) return true;
        return !/[\u4e00-\u9fa5a-zA-Z]/.test(text);
      }

      function commentWordScore(item) {
        let score = Math.max(1, Number(item.count || 1));
        const value = commentWordValue(item.word);
        if (value === 2) score *= 8;
        if (value === 1) score *= 3;
        if (value === -1) score = Math.max(1, score / 4);
        return score;
      }

      function collectSegmentHotWords(seg) {
        const display = safeArray(seg.hot_comments_display || seg.HotCommentsDisplay);
        if (display.length) {
          return display.map(word => ({
            word: normalizeCommentWord(firstText(word.word, word.Word, word.name, word.Name, word.text, word.Text, word)),
            count: firstText(word.count, word.Count, word.freq, word.Freq, word.times, word.Times, word.weight, word.Weight, "")
          })).filter(item => item.word).slice(0, 8);
        }
        return safeArray(
          seg.hot_words ||
          seg.HotWords ||
          seg.hot_comments ||
          seg.HotComments ||
          seg.comment_hot_words ||
          seg.CommentHotWords ||
          seg.comments_hot_words ||
          seg.CommentsHotWords
        ).map(word => ({
          word: normalizeCommentWord(firstText(word.word, word.Word, word.name, word.Name, word.text, word.Text, word)),
          count: firstText(word.count, word.Count, word.freq, word.Freq, word.times, word.Times, word.weight, word.Weight, "")
        })).filter(item => item.word && !isLowValueCommentWord(item.word))
          .sort((a, b) => {

      async function requestLegacyConsoleAPI(props, method, params) {
        if (window.Apis && typeof window.Apis.request === "function") {
          const result = await window.Apis.request(method, params);
          const error = Array.isArray(result) ? result[1] : null;
          if (error) throw error;
          return Array.isArray(result) ? result[0] : result;
        }
        if (typeof fetch !== "function") {
          throw new Error("当前页面缺少 fetch，无法调用 AI 分析接口");
        }
        const apiConfig = props.legacyConsoleAPI || props.legacy_console_api || {};
        const endpoint = firstText(apiConfig[method], apiConfig[method.replace(/[A-Z]/g, function (m) { return "_" + m.toLowerCase(); }).replace(/^_/, "")], "/api/" + method);
        const response = await fetch(endpoint, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ Param: params, param: params })
        });
        if (!response.ok) {
          throw new Error("AI 分析接口调用失败：" + response.status);
        }
        const data = await response.json();
        const baseResp = data && (data.BaseResp || data.base_resp || data.baseResp);
        const statusCode = firstNumber(baseResp && baseResp.StatusCode, baseResp && baseResp.status_code, 0);
        if (statusCode) {
          throw new Error(firstText(baseResp && baseResp.StatusMessage, baseResp && baseResp.status_message, "AI 分析接口调用失败"));
        }
        return data && (data.Body || data.body || data);
      }

        }
        const generateParams = {
          ReviewTaskID: reviewTaskId,
          SegmentId: Number(segmentId)

        if (accountId) generateParams.AccountId = Number(accountId);
        const generated = await requestLegacyConsoleAPI(props, "GenerateActivityContentAnalysisSuggestionConsole", generateParams);
        const generatedBody = generated && (generated.Body || generated.body || generated);
        const generatedSuggestion = firstText(generatedBody && generatedBody.Suggestion, generatedBody && generatedBody.suggestion, "");
        if (generatedSuggestion) return generatedSuggestion;
        for (let attempt = 0; attempt < 60; attempt += 1) {
          const getParams = {

            SegmentId: Number(segmentId)
          };
          if (accountId) getParams.AccountId = Number(accountId);
          const data = await requestLegacyConsoleAPI(props, "GetActivityContentAnalysisSuggestionConsole", getParams);

        }

        return e(React.Fragment, null,
          e(Header, { title: ecommerceMode ? mediaTitle : "直播内容复盘" }),
          e("main", { className: "report-shell" },
            e(ReviewScoring, {score:data.modules?.content_analysis?.scoring, part:"summary"}),
            ecommerceMode ? e(EcommerceReviewOverview, { module: data.modules && data.modules.content_analysis, part: "conclusion" }) : null,
            e("aside", { className: "left-rail" },
              e(Info, { live: data.live }),
              hasPlayback ? e(Playback, { live: data.live, playbackInfo: data.playbackInfo, content: data.content, modules: data.modules }) : null
            ),
            e("section", { className: "main-area" },
              e(Score, { metrics: data.metrics }),
              ecommerceMode ? e(EcommerceReviewOverview, { module: data.modules && data.modules.content_analysis, part: "insights" }) : null,
              e(Diagnosis, { diagnosis: data.diagnosis, modules: data.modules || {}, enabled: showLiveScore }),
              e(LiveChart, {
                enabled: showFullCurve,
                showHighlights: showHighlightMoment,
                lineData: data.lineData,
                curve: data.curve,
                interactionData: data.interactionData,
                highlightsData: data.highlightsData,
                content: data.content,
                modules: data.modules || {},
                baseStartTime: data.baseStartTime
              }),
              e(Analysis, { content: data.content, modules: data.modules || {}, live: data.live || {}, playbackAvailable: hasPlayback, showContentAnalysis: showContentAnalysis, showHighlights: showHighlightMoment, allowAIAnalysis: !ecommerceMode, showAllSegments: ecommerceMode, account_id: data.account_id || data.AccountId, review_task_id: data.review_task_id || data.ReviewTaskID, legacy_console_api: data.legacy_console_api || data.legacyConsoleAPI || {} }),
              e(ReviewScoring, {score:data.modules?.content_analysis?.scoring, part:"details", playbackAvailable:hasPlayback})
            )
          )
        );
      }

      if (!window.React || !window.ReactDOM) {
        document.getElementById("live-report-root").textContent = "React runtime 加载失败，无法渲染报告。";
        return;
      }
      ReactDOM.createRoot(document.getElementById("live-report-root")).render(e(LiveReportApp));
    })();
  </script>
<script>
  // Reading a static report must count as activity, including while watching its replay.
  (() => {
    const token = new URLSearchParams(location.search).get('token');
    if (location.protocol !== 'http:' || location.hostname !== '127.0.0.1' || !token) return;
    const keepAlive = () => fetch('/api/health?token=' + encodeURIComponent(token), {
      cache: 'no-store', signal: AbortSignal.timeout(5000)
    }).catch(() => {});
    keepAlive();
    setInterval(keepAlive, 60_000);
    window.addEventListener('pageshow', keepAlive);
  })();
</script>
</body>
</html>
