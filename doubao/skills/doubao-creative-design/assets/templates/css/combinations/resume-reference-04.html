<!doctype html><html><meta charset="utf-8"><!-- Visual layer only. Compose with layout layout.resume-name-photo. -->
<style data-resume-css="04">#resume-04{color:rgb(40, 41, 39);background-color:rgb(234, 234, 229);}
#resume-04 .skills li::before{visibility:visible;}
#resume-04 .work-copy::before{visibility:visible;}
#resume-04 .certifications li::before{visibility:visible;}
#resume-04{}
html, body{background-image:initial;background-color:var(--resume-paper,rgb(234, 234, 229));}
#resume-04{--paper:var(--resume-paper,#EAEAE5);--ink:var(--resume-ink,#282927);--red:var(--resume-accent,#B92028);background-image:initial;background-color:var(--resume-paper,rgb(234, 234, 229));color:var(--ink);font-family:var(--resume-condensed-font,"Arial Narrow", Arial, sans-serif);}
#resume-04 h1{font-family:var(--resume-body-font,Arial, sans-serif);color:var(--red);}
#resume-04 .name-flourish .knockout{stroke:var(--paper);}
#resume-04 .name-flourish .ink{stroke:var(--red);}
#resume-04 .name-flourish path{fill:none;}
#resume-04 .portrait{background-image:initial;background-color:transparent;}
#resume-04 .ref-asset img{filter:grayscale(1);}
#resume-04 h2{font-family:var(--resume-body-font,Arial, sans-serif);color:var(--red);}
#resume-04 ul{list-style-image:initial;}
#resume-04 h3{font-family:var(--resume-condensed-font,"Arial Narrow", Arial, sans-serif);}

#resume-04.lang-zh :where(h2, h3, .contact-label, .masthead strong){font-family:var(--resume-body-font,"PingFang SC", "Source Han Sans SC", sans-serif);}
#resume-04.lang-zh h1{font-family:var(--resume-body-font,"Source Han Sans SC", "PingFang SC", sans-serif);}
