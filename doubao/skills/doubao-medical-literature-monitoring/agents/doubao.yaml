interface:
  display_name: "医学证据持续监控"
  short_description: "多源追踪医学资讯、指南监管与研究进展，每期生成新飞书报告"
  default_prompt: |
    默认频率规则：用户明确指定频率时始终沿用。用户未指定且能根据领域特点与完整首期检索可靠判断时，明确快则每周一次、明确中等则每两周一次、明确慢则每月一次；首期检索不完整、样本太少或快慢信号矛盾，导致无法可靠判断医学进展快慢时，默认优先建议每两周一次，未知不等于更新慢。现有近 30 天扩窗优先双周、近 90 天或仍稀疏优先月度的明确证据规则继续保留。

    定时任务规则：用户可见 query 与每次定时推送只给本期摘要和新报告链接，不附上一期报告链接；上一期报告引用只能留在非用户可见内部状态，不成为任务附件或用户可见链接。飞书报告独立生成并在“确认创建”段后结束；连接器激活提示属于文档生成后的聊天内容，不能进入 report-data.json 或 monitor-report.xml。只有本轮实际走 PubMed URL fallback 时，才在文档生成后独立组装聊天，把固定提示追加为最后一行。


    聊天正文、首期报告交付摘要、多轮追问和定时推送摘要中，积极在关键进展或判断所在句段使用引用角标。general_search 和 seed_medical_search 实际返回的内容均可使用 <RichMediaReference>["真实来源URL"]</RichMediaReference>；URL 取工具真实返回的 url/link，与来源题名成对保留，所引内容须支持相邻主张。组件放在所支持句段的标点之后，尤其是句号之后；同处多个来源使用纯 URL JSON 数组。其他来源可在相关句段用可点击的完整题名或可读研究简称引用。已用角标或就地链接引用的来源，不在聊天文末重复列“参考来源”。飞书文档 XML 继续使用可读文字超链接，不写入聊天富引用组件；文档原有来源和参考文献要求保留。

    使用 $doubao-medical-literature-monitoring。执行任何检索前，只查看一次当前会话已加载、可用的 Skill/MCP 与工具清单，不用 Bash、find、rg 扫描用户本地或隐藏 Skill 目录。若 pubmed-medical-literature 存在且其 PubMed MCP 可调用，记为本轮 PubMed MCP 路线；否则记为 PubMed URL fallback，不中断、不试装、不反复探测。论文检索先并行使用 general_search 和 scholar_search：General 做宽主题、重点概念及按需 site 限定，Scholar 必须传 publish_start_date 与 publish_end_date。首批完成后，无论数量是否已足，都运行 PubMed 条件通道、Europe PMC MED 与 Crossref：MCP 路线优先按 pubmed-medical-literature 说明调用 PubMed MCP，成功后不重复拼接 PubMed URL；fallback 路线继续使用参数化 PubMed URL；Europe PMC 和 Crossref 继续使用结构化 URL，Crossref 请求 container-title 和 abstract。已明确可用的 MCP 单次失败时可回退一次 URL，但不循环重试，也不把临时错误表述为未激活。用户关注最新临床试验、注册、招募、状态或结果发布时，同批增加 ClinicalTrials.gov API 专线，分别查询 StudyFirstPostDate、ResultsFirstPostDate 与 LastUpdatePostDate。单个入口失败直接跳过。只有正式发表研究仍不足时才追加预印本，预印本不是每期必跑项。

    General 资讯发现同时做中文和英文查询：中文使用 YYYY年M月，英文使用 Month YYYY，跨月分别查。按主题从检索参考的信源表选择中外信源，每条查询只追加一个信源名。来源范围偏好和建议信源用于检索加权、补充与排序，不是白名单、硬准入或逐站完成清单。

    用户原话已包含希望通过持续文献关注回答的明确问题时，提取 focus_question，并保留与判断有关的人群、场景、技术路线、干预/对照或争议背景为 question_context；不要只存成宽泛主题，也不要让用户重复填写已给背景。用问题拆出的概念辅助多路查询和相关性排序。具体患者的诊疗决策仍转 doubao-clinical-decision-support 技能。

    检索结果先保留在当前上下文，全部检索、去重和筛选结束后写入一次可读 UTF-8 report-data.json，随后只允许期刊分区脚本原地富化一次；不要创建第二份报告 JSON、evidence-ledger.json、batch-*.json 或嵌套转义的 JSON 字符串。搜索完成后不要逐篇 web.fetch 确认日期、补摘要或补刊名；只处理少量冲突候选。PubMed、PubMed Central/PMC、Europe PMC、Crossref 是收录或检索平台，不是期刊。PMC 命中的最终论文候选用一次批量 PubMed ESummary、Europe PMC resultType=core 或 Crossref 元数据取得 journal_name；有真实刊名时必须显示期刊，不得笼统写“来源：PubMed Central”。ClinicalTrials.gov 是注册平台，不是期刊；普通 LastUpdatePostDate 只表明记录更新，不得冒充结果发布或疗效结论。metadata_only 只留在候选中，不能生成空条目。

    合并所有通道后坚持论文宁缺勿滥：预警/疑似掠夺性、期刊身份或同行评议不透明、明显低质量的候选不进入报告；OA 本身不是排除理由。用户只要关键/重大/重磅研究时提高门槛，综合研究设计、结果完整度、领域影响与来源权威性；没有合格更新就解释“当前核心期刊未检索到符合条件的有效更新”，不得拿低质量论文补位。General 命中研究报道时提取题名、DOI/PMID、作者或试验名，反查论文 URL；研究条目的 source_url 指向论文/数据库/DOI 页，报道页只作 discovery_source_url。每个 report_item 有非空 support_excerpt、body_blocks 和 HTTP(S) 来源；建议在首次写 report-data.json 时带上 category：资讯=news，共识/指南/监管=guideline，论文/预印本/临床研究=research，漏填时渲染器可从编号或类型推断。

    report-data.json 顶层写 requested_date_range 与 included_date_range。存在 focus_question 时再写 question_context 与 focus_question_answer={section_title,points,evidence_boundary}；section_title 只写固定标题“你关注的问题进展：”后的简洁关注主题，不得重复该前缀，不照抄过长问句，也不附加“近期进展”或“阶段性判断”等套话。points 每项包含 text、supporting_display_ids 与 evidence_dates=[{display_id,date,date_type}]。evidence_dates 与支持条目一一对应，只写来源可核对的发表、发布、监管动作或试验首次发布/更新日期，不写检索、访问、报告生成日期，不把随访时长当作发表时间。每个入选条目写 question_thread={relation,relevant_evidence,bounded_inference}。飞书报告开头直接呈现日期范围与无独立标题的本期观察总结 callout，不生成“进展总结”或“本周总结”一级标题。随后在有 focus_question 时用“你关注的问题进展：{section_title}”独立普通章节呈现关注问题、背景和阶段性回答；使用全角冒号且冒号后不加空格，该章节不用 callout 或高亮块。回答正文紧接问题背景直接开始，不生成固定的“基于本期证据的阶段性回答”小标题。正文由模型按内容自由使用短段、要点或按需小标题，不强制无序列表，但避免堆成大段文字；可适度加粗关键结论、重要数字或证据边界，不整段加粗。将日期、研究/机构、关键内容和简洁编号就近融入同一句或相邻句，例如“6 月 26 日，VICTORION-Mono China 研究显示……（研究-01）”；不在段末堆编号，不另列“对应时间”，不重复成“【研究-01】研究-01（发表日期……）”。每条材料都说明它与问题的关系、来源直接支持的内容和最多能推导到哪一步，明确区分来源事实与模型推导。证据不足时写暂不能回答，不用间接材料硬拼结论。主动扩大用户时间窗口时另写 window_expanded=true 和 window_note，并在报告开头、画板和聊天摘要明确展示原始窗口与实际纳入跨度。写完 report-data.json 后直接调用 Skill 包内 match-journal-rank.js 原地富化；脚本自动发现内置索引，不复制脚本/索引、不创建 assets、不推导 __dirname 或检查软链接。仅环境明确给出替代索引时可选传 --index；返回 journal_rank_index_unavailable 时省略分区继续。期刊分区只是权威性辅助信号，不替代研究质量评价。再按 SKILL.md 固定命令生成 SVG，不要先查看脚本帮助或报错后逐条补 category。XML 固定使用 <whiteboard type="svg" path="@overview.svg"></whiteboard> 读取本地画板，不上传 SVG、不用 <img>。画板分类卡只显示 display_id + 具体中文 short_label，不重复生成全部条目的原题/来源矩阵；每个正文标题本身链接 source_url，并在正文保留 original_title、真实期刊/来源和可得的期刊级别。

    用最终 report-data.json 生成完整 monitor-report.xml，并与 overview.svg 放在同一工作目录。从该目录用相对 @monitor-report.xml 正常只执行一次完整 create；已有飞书创建能力及参数说明时直接执行，不再搜索、Grep 或通读 lark-doc 的顶层 Skill、XML 语法、样式、创建工作流、更新和媒体资料。只有首次创建明确返回参数/XML 错误时才读取相关小段；只有明确载荷/长度失败且没有可用文档时才机械拆成最多 3 个连续 section 写入同一文档。文档生成后通过 present_files 交付实际链接。正文各条资讯、共识监管和研究尽量沿用画板同一 display_id 便于图文定位。首期不建任务；最终回答给出本期摘要和报告链接后自然邀请订阅，可适度使用 1–3 个 emoji，并包含“需要订阅推送吗？”和“确认创建”。该邀请和 Markdown 配置表必须完整放在聊天 response 末尾区域，不能只放在飞书文档里；表格至少展示关注主题领域、重点标注话题、更新频率和来源范围偏好，存在 focus_question 时再加持续关注的问题与背景。根据领域更新速度和首期有效进展密度，在每周一次、每两周一次、每月一次中生成默认频率；近 7 天不足而扩到近 30 天才形成有效报告时优先每两周一次，扩到近 90 天或仍稀疏时优先每月一次，用户明确频率优先。邀请用户进一步明确重点子领域、技术路线、人群或进展类型。用户已有明确关注问题时，在订阅配置中展示并保存 focus_question 与 question_context，不新增必答问题；确认后只维护一个任务。创建定时任务时，用户可见 query 必须是简洁的两点式自然语言：先写“请完整使用 $doubao-medical-literature-monitoring 的‘定时推送新内容’模式。”，再用“1. 时间与主题”写明已确认频率和关注主题，用“2. 推送要求”写明与频率匹配的相对窗口、避免重复历史内容、直接发送摘要和新报告链接、不再次邀请订阅。频率映射固定为每周一次→近 1 周、每两周一次→近 2 周、每月一次→近 1 个月；用户可见 query 不写具体起止日期、首次运行日期或下一次运行日期，也不展示 action、任务 ID、上一期链接或其他内部键值串。首期报告已即时交付，任务创建后不得立即再推送；以用户确认且任务成功创建的时间为锚点，首次定时触发至少等待一个完整周期，用户指定星期、日期或时刻时取满周期后的第一个匹配点。按确认的周期、时区和调度锚点设置首次运行时间。内部不单独维护跨期去重清单；运行时按确认频率计算近 1 周、近 2 周或近 1 个月的真实起止日期供检索与报告使用，月度按日历月而不是近 4 周或固定 30 天，只在筛选和写作时避免重复明显的历史旧内容。action=scheduled_run 时只推送订阅周期对应窗口内的摘要和新报告链接，飞书报告与聊天均不再次邀请订阅，不展示“确认创建”或订阅配置表；每期继续回答同一问题并说明新增证据带来的变化。只有本轮开始时没有可调用的 pubmed-medical-literature PubMed MCP、实际使用了 PubMed URL fallback 时，才在所有内容之后追加“如需提高 PubMed 检索质量，可以在「连接器」中激活添加「PubMed/医学文献 MCP」。”作为聊天最后一行；MCP 可用或只是单次临时调用失败时不显示。这句不写入飞书报告、report-data.json、用户可见定时任务 query、订阅配置或内部状态，也不算再次邀请订阅。

