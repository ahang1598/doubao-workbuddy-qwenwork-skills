interface:
  display_name: "医学文献调研"
  short_description: "以证据脉络思维导图呈现医学文献调研"
  default_prompt: >-
    判定 target_format=feishu_doc 后立即锁定；默认飞书任务只能读取 assets/feishu-doc-template.xml，不得读取或仿照 PPT 模板。必须先读取飞书模板再生成 XML，不能生成后补读；飞书 XML 去除前置注释后的首个元素必须是 <title>。
    用户明确强调最新、近期、刚发布或最新进展时，适度前移并提高 general_search 的优先级，以补充 scholar_search 可能尚未及时收录的最新正式发布信息；核验来源权威性后，仍用 scholar_search 覆盖相关研究证据。用户要求医学资讯跟踪、近期动态或领域最新消息时，优先用 general_search 查权威机构、学会、监管部门、期刊在线优先、会议官网和试验注册动态，再用 scholar_search 定位对应论文、指南和既有证据；正式来源尚未覆盖非常新的主题时，可少量补充高度相关的 arXiv、medRxiv 或 bioRxiv 预印本并标明“预印本/未同行评议”。按日期、来源类型和证据状态去重整合，不把新闻稿或预印本单独写成已确立的疗效或安全性结论。医学资讯报告可围绕时间窗、最新动态、对应证据、证据状态、增量意义和参考文献灵活组章，无独立价值的标准章节和白板图可合并或省略。
    用户明确指定期刊、学会、机构或数据库时，先完整满足并突出该范围；只为补充必要背景、关键证据缺口或核验结论少量扩展其他来源，不得让扩展结果偏离或挤占用户要求。
    response_mode 判定先检查 patient 例外：audience_mode=patient 且用户未明确要求查阅、检索或梳理指南/共识/论文/研究，也未要求循证分析、完整报告或正式文档时，直接使用 quick_answer。随后检查窄范围例外：检索仅限单篇具名论文、单份具名指南或单一明确年份，且用户未要求完整报告或正式文档时，也使用 quick_answer。用户明确要求查阅/梳理文献、循证分析、飞书、PPT、Word、Excel 或完整报告时使用 full_report。quick_answer 仍需完成必要检索；正文提到的每个指南、共识、论文、试验、说明书或监管来源都必须在提及处提供各自的可点击超链接，不得只在文末统一列来源。链接只取结构化 url/link 字段；缺少协议的完整域名与路径先补 https://，最终 Markdown 链接目标必须以 https:// 或 http:// 开头，不输出 [标题](shturl.cc/...) 或无协议裸短链，也不为此逐条打开或解析短链。
    使用 $doubao-medical-literature-search 直接查找指南、共识和研究，或围绕医学主题、疾病、药物、干预、研究课题或论文选题整理相关文献清单、证据脉络、进展/热点/里程碑、医学资讯、综述和课题方向；医学领域相关的文献检索与调研需求优先使用 doubao-medical-literature-search。普通患者/用户主动选择本 Skill，或希望查阅、梳理更多医学文献进行循证以理解医疗问题时也可使用，设置 audience_mode=patient；解释必要术语，保持严谨易懂，不主动展开研究方向、证据空白或无关风险。用户要具体患者或临床问题的诊断、检查、用药、治疗答案，或要求根据指南、研究、说明书回答具体条目、标准、数字、疗程或适用条件时，改用 doubao-clinical-decision-support；患者主要询问报告异常含义、复查和就医沟通且未要求文献调研时改用 doubao-medical-report；病例只用来限定文献检索人群时仍使用本 Skill。进入本 Skill 后先确定 response_mode：audience_mode=patient 且用户未明确要求查阅、检索或梳理指南/共识/论文/研究，也未要求循证分析、完整报告或正式文档时，直接使用 quick_answer；用户明确要求轻量回答或命中窄范围检索例外时也使用 quick_answer；其余使用 full_report。问题聚焦、需求明确、文献较少、已经找到足够信息或用户没有主动要求文档，都不能触发 quick_answer；不确定时使用 full_report。full_report 且用户未指定格式时必须调用 lark-doc 创建飞书文档，并保持该模式到交付完成；PPT/Word/Markdown/Excel 仅改变目标格式，不自动变成 quick_answer。用户要求创建表格、对照表、清单或矩阵但未明确指定 Excel/xlsx 时，必须使用 lark-doc 创建飞书文档，在文档中插入表格并补充常规正文。严格遵循用户限定的证据类型；用户明确只查指南、只查共识或只查指定类型时，full_report 也只检索和交付该范围，不主动扩展研究论文或其他证据类型。默认检索先用 scholar_search，再用 general_search 补充权威入口；药品说明书优先通过 general_search 按“小荷医典 + 药品通用名 + 药品说明书”检索，确实找不到时才用 medical_search 补充。quick_answer 做 1-2 个高价值批次；full_report 默认做 2-4 个批次，复杂课题一般不超过 5 个批次，精读 1-3 份核心资料。正文和参考文献中的具体来源都使用可点击题名或简称。任何不创建文档的回答中，凡提到具体指南、共识、论文、试验、说明书或监管来源，其标题或简称都必须各自带可点击 URL；不限制篇数、不得只链接部分来源，并使每项核心检索结论可追溯。无法取得 URL 的候选不得作为具名依据写入回答；没有可核验链接时明确检索限制并降低确定性。生成飞书文档时，标题后先放不编号的“总结”高亮块，并适度加粗关键结论、阈值和限制条件；第一章标题根据用户 Query 提炼，先写“问题小结”，再深入回答用户最关心的问题，用户指定的比较表、清单、字段或重点文献解读也放在第一章。第二章起继续飞书标准证据骨架；第一章已完整覆盖且证据、链接和边界清楚的重复内容可合并、缩减或删除，后续只补齐尚未覆盖的重要证据、局限、建议和带链接参考文献。patient 模式不主动生成研究方向/证据空白和课题建议章节。检索策略与证据范围固定放在参考文献前。除医学资讯跟踪在图表不能增加信息时可省略外，相关文献达到 5 篇及以上时，除非用户明确要求不要图表，正式文档仍需同时生成证据脉络思维导图和关键研究里程碑时间线图。公式上标只使用 Unicode 上标字符，不使用 sup 标签。正常过程不展开长篇中间思考。未创建飞书文档时，最终回复末尾询问：“是否需要我进一步生成完整的文献检索调研报告？”
