<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌宠小屋</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #dashboard {
      width: 100%;
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--surface, #ffffff);
      border-radius: var(--radius, 24px);
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .pet-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--background, #fff7ed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .pet-info h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text, #3a2a20);
      margin-bottom: 4px;
    }
    .pet-info p {
      font-size: 13px;
      color: var(--muted, #9a7b6a);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-item {
      background: var(--background, #fff7ed);
      border-radius: 16px;
      padding: 14px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--muted, #9a7b6a);
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--text, #3a2a20);
    }
    .stat-value small {
      font-size: 12px;
      font-weight: normal;
      color: var(--muted, #9a7b6a);
    }
    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text, #3a2a20);
      margin-bottom: 12px;
    }
    .interactions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .interaction-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      background: var(--background, #fff7ed);
      color: var(--text, #3a2a20);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .interaction-btn:hover {
      background: var(--accent, #ffc987);
      transform: translateY(-1px);
    }
    .settings-group {
      margin-bottom: 16px;
    }
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--background, #fff7ed);
    }
    .setting-item:last-child {
      border-bottom: none;
    }
    .setting-label {
      font-size: 14px;
      color: var(--text, #3a2a20);
    }
    .setting-desc {
      font-size: 12px;
      color: var(--muted, #9a7b6a);
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      background: var(--muted, #9a7b6a);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.active {
      background: var(--primary, #ff8a24);
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.active::after {
      transform: translateX(20px);
    }
    .size-selector {
      display: flex;
      gap: 8px;
    }
    .size-btn {
      padding: 6px 12px;
      border: 1px solid var(--accent, #ffc987);
      border-radius: 8px;
      background: transparent;
      color: var(--text, #3a2a20);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .size-btn.active {
      background: var(--primary, #ff8a24);
      border-color: var(--primary, #ff8a24);
      color: white;
    }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--background, #fff7ed);
      border-radius: 50%;
      color: var(--muted, #9a7b6a);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .close-btn:hover {
      background: var(--accent, #ffc987);
      color: var(--text, #3a2a20);
    }
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }
    .content-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .content-scroll::-webkit-scrollbar-thumb {
      background: var(--accent, #ffc987);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="dashboard">
    <div class="card" style="position: relative; flex: 1; display: flex; flex-direction: column;">
      <button class="close-btn" id="close-btn">×</button>
      <div class="content-scroll">
        <div class="header">
          <div class="pet-avatar">🐱</div>
          <div class="pet-info">
            <h2 id="pet-name">桌宠</h2>
            <p id="pet-personality">正在加载角色信息</p>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">💕 好感度</div>
            <div class="stat-value" id="affection">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">😊 心情</div>
            <div class="stat-value" id="mood">80</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">🎯 今日互动</div>
            <div class="stat-value" id="today-interactions">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">⏰ 陪伴时长</div>
            <div class="stat-value" id="companion-minutes">0<small>分钟</small></div>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-title">✨ 互动</div>
          <div class="interactions" id="interactions-list">
          </div>
        </div>

        <div class="settings-group">
          <div class="section-title">⚙️ 设置</div>
          <div class="setting-item">
            <div>
              <div class="setting-label">置顶显示</div>
              <div class="setting-desc">桌宠窗口始终在最前面</div>
            </div>
            <div class="toggle active" id="toggle-always-on-top"></div>
          </div>
          <div class="setting-item">
            <div>
              <div class="setting-label">鼠标穿透</div>
              <div class="setting-desc">点击穿透到后面的窗口</div>
            </div>
            <div class="toggle" id="toggle-click-through"></div>
          </div>
          <div class="setting-item">
            <div>
              <div class="setting-label">桌宠大小</div>
              <div class="setting-desc">调整桌宠显示大小</div>
            </div>
            <div class="size-selector" id="size-selector">
              <button class="size-btn" data-scale="0.65">小</button>
              <button class="size-btn active" data-scale="0.8">标准</button>
              <button class="size-btn" data-scale="1">大</button>
              <button class="size-btn" data-scale="1.2">超大</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
