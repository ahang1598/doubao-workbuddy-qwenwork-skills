<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌宠</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #pet-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    #pet-sprite {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      transform-origin: bottom center;
      transition: transform 0.1s ease-out;
    }
    .breathing {
      animation: breathe var(--breath-period, 3.2s) ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(var(--breath-scale-x, 1.012), var(--breath-scale-y, 1.022)); }
    }
    .squash {
      animation: squash var(--squash-duration, 0.32s) ease-out;
    }
    @keyframes squash {
      0% { transform: scale(1, 1); }
      50% { transform: scale(calc(1 + var(--squash-intensity, 0.08)), calc(1 - var(--squash-intensity, 0.08))); }
      100% { transform: scale(1, 1); }
    }
    #feedback-bubble {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 14px;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #feedback-bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-10px);
    }
  </style>
</head>
<body>
  <div id="pet-container">
    <img id="pet-sprite" class="breathing" alt="桌宠" draggable="false">
    <div id="feedback-bubble"></div>
  </div>
</body>
</html>
