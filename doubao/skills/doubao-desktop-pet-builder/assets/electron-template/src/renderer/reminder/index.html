<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提醒</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #reminder-card {
      width: 100%;
      height: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--surface, #ffffff);
      border-radius: var(--radius, 24px);
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text, #3a2a20);
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    label {
      font-size: 13px;
      color: var(--muted, #9a7b6a);
    }
    input[type="text"], input[type="datetime-local"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--accent, #ffc987);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text, #3a2a20);
      background: var(--background, #fff7ed);
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--primary, #ff8a24);
    }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-primary {
      background: var(--primary, #ff8a24);
      color: white;
    }
    .btn-secondary {
      background: var(--background, #fff7ed);
      color: var(--text, #3a2a20);
    }
    .reminder-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--background, #fff7ed);
    }
    .reminder-item:last-child {
      border-bottom: none;
    }
    .reminder-text {
      font-size: 14px;
      color: var(--text, #3a2a20);
    }
    .reminder-time {
      font-size: 12px;
      color: var(--muted, #9a7b6a);
    }
    .delete-btn {
      background: none;
      border: none;
      color: var(--muted, #9a7b6a);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 12px;
    }
    .reminder-list {
      max-height: 150px;
      overflow-y: auto;
    }
    .reminder-list::-webkit-scrollbar {
      width: 4px;
    }
    .reminder-list::-webkit-scrollbar-thumb {
      background: var(--accent, #ffc987);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="reminder-card">
    <div class="card">
      <div class="title">⏰ 添加提醒</div>
      <div class="input-group">
        <label>提醒内容</label>
        <input type="text" id="reminder-text" placeholder="输入提醒内容...">
      </div>
      <div class="input-group">
        <label>提醒时间</label>
        <input type="datetime-local" id="reminder-time">
      </div>
      <div class="btn-row">
        <button class="btn-secondary" id="cancel-btn">取消</button>
        <button class="btn-primary" id="save-btn">保存</button>
      </div>
    </div>
  </div>
</body>
</html>
