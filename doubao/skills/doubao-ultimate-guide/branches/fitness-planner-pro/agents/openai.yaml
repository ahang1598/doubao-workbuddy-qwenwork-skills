interface:
  display_name: "Fitness Planner Pro"
  short_description: "生成可执行、可记录的飞书健身攻略"
  default_prompt: "使用 $fitness-planner-pro 按其 SKILL.md 的 8 步流程执行：提取约束 → 场景路由 → 做场景指纹和标题（禁止默认 XX攻略/计划/方案，要含我的场景词）→ 先建立清晰充盈攻略骨架再做视觉：第一屏直接答今天先做什么/本周怎么排/最重要停止条件；主要模块按“为什么这么做 → 具体怎么执行 → 怎么判断和调整”写；训练写动作名、组数、次数/时长、强度大白话、休息、热身/收操、进阶和替代；饮食写食堂/外卖/早餐午餐晚餐点餐口令和样例；核心动作写起始姿势、执行路径、发力感觉、常见错误+修正、降阶/进阶、停止条件；至少覆盖2类执行阻力（漏练、吃超、器械被占、时间不够、没动力、酸痛/疼痛、平台期等）和复盘指标 → 用 output-contract.md 的 XML 骨架填内容（≥5 类富 block，核心动作给真实视频/图解 bookmark，中文用户优先 B 站/小红书/国内权威；XML 只用白名单标签 title/h1/h2/h3/p/b/i/br/callout/grid/column/table/thead/tbody/tr/th/td/checkbox/bookmark/blockquote/hr/img；严禁自造 <card>/<timeline>/<badge>/<section>；复选任务只用 <checkbox done=\"false\">文本</checkbox>，严禁 <input type=\"checkbox\" /> 或任何 HTML 表单标签；主要H2不能只有一句话或一张薄表）→ 图片只搜真实、权威、可验证参考图；搜不到可靠图就不插图，严禁生成健身动作图片；XML 正文不得写图片占位注释或 anchor/caption/source 字段，图片元数据写旁路 image-plan.tsv，未找到可靠图记录 status=no_reliable_image → 写本地 .xml 和 image-plan.tsv → 运行 scripts/check_fitness_quality.py --stage draft --image-plan image-plan.tsv 必须 PASSED → lark-cli docs +create --api-version v2 --doc-format xml --content @file.xml → 只按 image-plan.tsv 中 status=ready 的行用 +media-insert 插图 → 文档正文不要出现补资料尾巴，缺失变量改成适用边界、强度开关、替代动作和停止条件 → 最终只回文档标题+URL+1–3 条内容亮点，不粘贴正文，不解释媒体检索结果，不追问补充信息。正文和最终回复不得暴露 lark-cli 版本/auth/权限/fallback/image-plan/no_reliable_image 等内部状态。详细规则全部以 SKILL.md 和 references/ 为准，不在此重复。"
policy:
  allow_implicit_invocation: true
