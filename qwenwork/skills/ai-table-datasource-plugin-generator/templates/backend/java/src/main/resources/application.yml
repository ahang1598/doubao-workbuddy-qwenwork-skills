server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: datasource-plugin
  # 从项目根目录（backend/）下的 .env 文件加载配置
  # optional: 表示文件不存在时不报错
  # [.properties] 表示按 properties 格式解析（key=value）
  config:
    import: "optional:file:.env[.properties]"

plugin:
  # 与 AI 表格服务端约定的签名密钥，上架插件时由平台分配
  # 生产环境通过 application-prod.yml 从环境变量 PLUGIN_SECRET_KEY 读取
  secret-key: your-secret-key-here
  # 是否开启签名验证。本地开发设为 false，生产环境在 prod profile 中强制为 true
  enable-signature-verification: false

logging:
  level:
    com.dingtalk.plugin: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
