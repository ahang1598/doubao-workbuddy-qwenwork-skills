<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思词汇学习</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f9ff; color: #0c4a6e; }
        
        .card-container { perspective: 1000px; }
        .card {
            width: 100%; height: 380px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .card.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(14, 165, 233, 0.15);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 40px;
        }
        .card-back { transform: rotateY(180deg); background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%); }
        
        .phonetic { font-family: 'Times New Roman', serif; font-style: italic; }
        
        .rating-btn {
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .rating-again { background: #fee2e2; color: #991b1b; }
        .rating-hard { background: #fef3c7; color: #92400e; }
        .rating-good { background: #d1fae5; color: #065f46; }
        .rating-easy { background: #dbeafe; color: #1e40af; }
        .rating-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        
        .quiz-option {
            padding: 16px 20px;
            background: #f0f9ff;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .quiz-option:hover { border-color: #0ea5e9; background: #e0f2fe; }
        .quiz-option.correct { border-color: #10b981; background: #d1fae5; }
        .quiz-option.wrong { border-color: #ef4444; background: #fee2e2; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-2xl mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <div class="inline-flex items-center gap-2 bg-sky-100 text-sky-700 px-4 py-2 rounded-full text-sm font-medium mb-4">
                <span>📚</span> 雅思核心词汇
            </div>
            <h1 class="text-3xl font-bold text-sky-900 mb-2">雅思词汇学习</h1>
            <p class="text-sky-600">掌握雅思高频词汇，提升语言能力</p>
        </header>

        <div class="grid grid-cols-4 gap-3 mb-8">
            <div class="bg-white rounded-xl p-4 text-center shadow-sm border border-sky-100">
                <div class="text-2xl font-bold text-sky-600" id="statTotal">20</div>
                <div class="text-xs text-sky-400">总词汇</div>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm border border-sky-100">
                <div class="text-2xl font-bold text-sky-600" id="statLearned">0</div>
                <div class="text-xs text-sky-400">已学习</div>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm border border-sky-100">
                <div class="text-2xl font-bold text-sky-600" id="statMastered">0</div>
                <div class="text-xs text-sky-400">已掌握</div>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm border border-sky-100">
                <div class="text-2xl font-bold text-sky-600" id="statStreak">0</div>
                <div class="text-xs text-sky-400">连对</div>
            </div>
        </div>

        <div class="flex justify-center gap-2 mb-8 p-1 bg-sky-100 rounded-full w-fit mx-auto">
            <button onclick="setMode('flashcard')" class="mode-tab px-6 py-2 rounded-full font-medium transition-all bg-white text-sky-600 shadow-sm" data-mode="flashcard">闪卡</button>
            <button onclick="setMode('quiz')" class="mode-tab px-6 py-2 rounded-full font-medium transition-all text-sky-600" data-mode="quiz">测验</button>
            <button onclick="setMode('browse')" class="mode-tab px-6 py-2 rounded-full font-medium transition-all text-sky-600" data-mode="browse">词库</button>
        </div>

        <div id="flashcardMode" class="mode-content">
            <div class="card-container mb-6">
                <div class="card" id="flashcard" onclick="flipCard()">
                    <div class="card-face">
                        <span class="text-sm font-medium text-sky-600 bg-sky-50 px-3 py-1 rounded-full mb-6" id="wordType">verb</span>
                        <h2 class="text-5xl font-bold text-sky-900 mb-4" id="wordText">abandon</h2>
                        <p class="phonetic text-xl text-sky-500 mb-6" id="wordPhonetic">/əˈbændən/</p>
                        <span class="text-sm text-sky-300 mt-8">点击翻转查看释义</span>
                    </div>
                    <div class="card-face card-back">
                        <h3 class="text-3xl font-bold text-sky-800 mb-4" id="wordMeaning">放弃，抛弃</h3>
                        <div class="text-left w-full max-w-md border-l-4 border-sky-400 pl-4 mt-4">
                            <p class="text-sky-700 mb-2 italic" id="wordExample">"They had to abandon their car and walk."</p>
                            <p class="text-sky-500 text-sm">他们不得不弃车步行。</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="ratingButtons" class="hidden grid grid-cols-4 gap-3 mb-6">
                <button onclick="rateCard('again')" class="rating-btn rating-again">重来</button>
                <button onclick="rateCard('hard')" class="rating-btn rating-hard">困难</button>
                <button onclick="rateCard('good')" class="rating-btn rating-good">良好</button>
                <button onclick="rateCard('easy')" class="rating-btn rating-easy">简单</button>
            </div>

            <div class="flex justify-center items-center gap-6">
                <button onclick="prevCard()" class="w-12 h-12 rounded-full bg-white shadow-md flex items-center justify-center text-sky-600 hover:bg-sky-50">←</button>
                <span class="text-sky-500 font-medium" id="cardProgress">1 / 20</span>
                <button onclick="nextCard()" class="w-12 h-12 rounded-full bg-white shadow-md flex items-center justify-center text-sky-600 hover:bg-sky-50">→</button>
            </div>

            <div class="mt-8">
                <div class="h-2 bg-sky-100 rounded-full overflow-hidden">
                    <div class="h-full bg-sky-500 rounded-full transition-all" id="progressBar" style="width: 5%"></div>
                </div>
            </div>
        </div>

        <div id="quizMode" class="mode-content hidden">
            <div class="bg-white rounded-2xl p-6 shadow-lg border border-sky-100 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-sm font-medium text-sky-600 bg-sky-50 px-3 py-1 rounded-full">选择正确的中文释义</span>
                    <span class="text-sm text-sky-400" id="quizProgress">1 / 20</span>
                </div>
                <h3 class="text-3xl font-bold text-sky-900 mb-2 text-center" id="quizWord">abandon</h3>
                <p class="phonetic text-center text-sky-500 mb-6" id="quizPhonetic">/əˈbændən/</p>
                <div class="space-y-3" id="quizOptions"></div>
            </div>
        </div>

        <div id="browseMode" class="mode-content hidden">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="browseGrid"></div>
        </div>
    </div>

    <script>
        // 使用反引号(`)包裹字符串，可安全包含中文引号
        const vocabulary = [
            { word: "abandon", phonetic: "/əˈbændən/", type: "verb", meaning: `放弃，抛弃`, example: `They had to abandon their car and walk.` },
            { word: "ability", phonetic: "/əˈbɪləti/", type: "noun", meaning: `能力，才能`, example: `She has the ability to solve complex problems.` },
            { word: "absence", phonetic: "/ˈæbsəns/", type: "noun", meaning: `缺席，缺乏`, example: `His absence from the meeting was noticed.` },
            { word: "absolute", phonetic: "/ˈæbsəluːt/", type: "adjective", meaning: `绝对的，完全的`, example: `I have absolute confidence in your abilities.` },
            { word: "abstract", phonetic: "/ˈæbstrækt/", type: "adjective", meaning: `抽象的`, example: `The painting is an abstract representation.` },
            { word: "abundant", phonetic: "/əˈbʌndənt/", type: "adjective", meaning: `丰富的，大量的`, example: `The region has abundant natural resources.` },
            { word: "academic", phonetic: "/ˌækəˈdemɪk/", type: "adjective", meaning: `学术的`, example: `She has a strong academic background.` },
            { word: "accelerate", phonetic: "/əkˈseləreɪt/", type: "verb", meaning: `加速，促进`, example: `The policy will accelerate economic growth.` },
            { word: "access", phonetic: "/ˈækses/", type: "noun", meaning: `进入，使用`, example: `Students have access to the library 24/7.` },
            { word: "accommodate", phonetic: "/əˈkɒmədeɪt/", type: "verb", meaning: `容纳，适应`, example: `The hotel can accommodate 500 guests.` },
            { word: "accomplish", phonetic: "/əˈkʌmplɪʃ/", type: "verb", meaning: `完成，实现`, example: `She accomplished her mission successfully.` },
            { word: "accurate", phonetic: "/ˈækjərət/", type: "adjective", meaning: `精确的，准确的`, example: `The forecast was surprisingly accurate.` },
            { word: "achieve", phonetic: "/əˈtʃiːv/", type: "verb", meaning: `达到，实现`, example: `He worked hard to achieve his goals.` },
            { word: "acknowledge", phonetic: "/əkˈnɒlɪdʒ/", type: "verb", meaning: `承认，致谢`, example: `I acknowledge that I made a mistake.` },
            { word: "acquire", phonetic: "/əˈkwaɪər/", type: "verb", meaning: `获得，习得`, example: `Children acquire language naturally.` },
            { word: "adapt", phonetic: "/əˈdæpt/", type: "verb", meaning: `适应，改编`, example: `We need to adapt to the changing environment.` },
            { word: "adequate", phonetic: "/ˈædɪkwət/", type: "adjective", meaning: `足够的，适当的`, example: `The funding is not adequate for the project.` },
            { word: "adjust", phonetic: "/əˈdʒʌst/", type: "verb", meaning: `调整，适应`, example: `It takes time to adjust to a new culture.` },
            { word: "administer", phonetic: "/ədˈmɪnɪstər/", type: "verb", meaning: `管理，执行`, example: `The test was administered to all students.` },
            { word: "advocate", phonetic: "/ˈædvəkeɪt/", type: "verb", meaning: `提倡，拥护`, example: `She advocates for equal rights.` }
        ];

        let currentIndex = 0;
        let isFlipped = false;
        let currentMode = 'flashcard';
        let progress = {};
        let streak = 0;

        function init() {
            renderCard();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(mode + 'Mode').classList.remove('hidden');
            
            document.querySelectorAll('.mode-tab').forEach(tab => {
                if (tab.dataset.mode === mode) {
                    tab.classList.add('bg-white', 'shadow-sm', 'text-sky-600');
                } else {
                    tab.classList.remove('bg-white', 'shadow-sm', 'text-sky-600');
                }
            });
            
            if (mode === 'quiz') renderQuiz();
            if (mode === 'browse') renderBrowse();
        }

        function renderCard() {
            const word = vocabulary[currentIndex];
            document.getElementById('wordType').textContent = word.type;
            document.getElementById('wordText').textContent = word.word;
            document.getElementById('wordPhonetic').textContent = word.phonetic;
            document.getElementById('wordMeaning').textContent = word.meaning;
            document.getElementById('wordExample').textContent = `"${word.example}"`;
            document.getElementById('cardProgress').textContent = `${currentIndex + 1} / ${vocabulary.length}`;
            
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('ratingButtons').classList.add('hidden');
            
            const pct = ((currentIndex + 1) / vocabulary.length) * 100;
            document.getElementById('progressBar').style.width = pct + '%';
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
            document.getElementById('ratingButtons').classList.toggle('hidden', !isFlipped);
        }

        function rateCard(rating) {
            const word = vocabulary[currentIndex];
            progress[word.word] = rating;
            
            if (rating === 'good' || rating === 'easy') streak++;
            else streak = 0;
            
            nextCard();
            updateStats();
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % vocabulary.length;
            renderCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length;
            renderCard();
        }

        function updateStats() {
            const learned = Object.keys(progress).length;
            const mastered = Object.values(progress).filter(r => r === 'good' || r === 'easy').length;
            
            document.getElementById('statLearned').textContent = learned;
            document.getElementById('statMastered').textContent = mastered;
            document.getElementById('statStreak').textContent = streak;
        }

        function renderQuiz() {
            const word = vocabulary[currentIndex];
            document.getElementById('quizWord').textContent = word.word;
            document.getElementById('quizPhonetic').textContent = word.phonetic;
            document.getElementById('quizProgress').textContent = `${currentIndex + 1} / ${vocabulary.length}`;
            
            const wrong = vocabulary
                .filter((_, i) => i !== currentIndex)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(w => w.meaning);
            
            const options = [word.meaning, ...wrong].sort(() => Math.random() - 0.5);
            
            document.getElementById('quizOptions').innerHTML = options.map(opt => 
                `<button class="quiz-option w-full" onclick="selectQuiz('${opt}', '${word.meaning}')">${opt}</button>`
            ).join('');
        }

        function selectQuiz(selected, correct) {
            const buttons = document.querySelectorAll('.quiz-option');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correct) btn.classList.add('correct');
                else if (btn.textContent === selected) btn.classList.add('wrong');
            });
            
            if (selected === correct) streak++;
            else streak = 0;
            
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % vocabulary.length;
                renderQuiz();
                updateStats();
            }, 1500);
        }

        function renderBrowse() {
            const grid = document.getElementById('browseGrid');
            grid.innerHTML = vocabulary.map((word, i) => `
                <div class="bg-white rounded-xl p-4 shadow-sm border border-sky-100 cursor-pointer hover:shadow-md transition-all" onclick="jumpTo(${i})">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-sky-900">${word.word}</h4>
                        <span class="text-xs text-sky-500 bg-sky-50 px-2 py-1 rounded">${word.type}</span>
                    </div>
                    <p class="text-sm text-sky-600 phonetic mb-1">${word.phonetic}</p>
                    <p class="text-sky-700">${word.meaning}</p>
                </div>
            `).join('');
        }

        function jumpTo(index) {
            currentIndex = index;
            setMode('flashcard');
            renderCard();
        }

        document.addEventListener('keydown', (e) => {
            if (currentMode !== 'flashcard') return;
            if (e.code === 'Space') { e.preventDefault(); flipCard(); }
            else if (e.code === 'ArrowRight') nextCard();
            else if (e.code === 'ArrowLeft') prevCard();
        });

        init();
    </script>
</body>
</html>
