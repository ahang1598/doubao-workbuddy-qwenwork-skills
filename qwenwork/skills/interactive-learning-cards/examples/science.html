<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学元素周期表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; }
        
        .card-container { perspective: 1000px; }
        .card {
            width: 100%; height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .card.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.2);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 40px;
            border: 1px solid rgba(14, 165, 233, 0.3);
        }
        .card-back { transform: rotateY(180deg); background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        
        .element-symbol {
            font-size: 6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0ea5e9 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .rating-btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(14, 165, 233, 0.5);
            background: rgba(14, 165, 233, 0.1);
            color: #7dd3fc;
        }
        .rating-btn:hover { background: rgba(14, 165, 233, 0.3); box-shadow: 0 0 20px rgba(14, 165, 233, 0.3); }
        
        .quiz-option {
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            color: #e2e8f0;
        }
        .quiz-option:hover { border-color: #0ea5e9; background: rgba(14, 165, 233, 0.1); }
        .quiz-option.correct { border-color: #10b981; background: rgba(16, 185, 129, 0.2); }
        .quiz-option.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }
        
        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
            pointer-events: none;
        }
        .glow-1 { width: 400px; height: 400px; background: #0ea5e9; top: -100px; right: -100px; }
        .glow-2 { width: 300px; height: 300px; background: #8b5cf6; bottom: 10%; left: -50px; }
    </style>
</head>
<body class="min-h-screen">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    
    <div class="relative z-10 max-w-2xl mx-auto px-4 py-10">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">化学元素周期表</h1>
            <p class="text-slate-400">探索元素世界，掌握化学基础</p>
        </header>

        <div class="grid grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-800/50 rounded-xl p-4 text-center border border-cyan-500/20">
                <div class="text-2xl font-bold text-cyan-400" id="statTotal">20</div>
                <div class="text-xs text-slate-400">总元素</div>
            </div>
            <div class="bg-slate-800/50 rounded-xl p-4 text-center border border-cyan-500/20">
                <div class="text-2xl font-bold text-cyan-400" id="statLearned">0</div>
                <div class="text-xs text-slate-400">已学习</div>
            </div>
            <div class="bg-slate-800/50 rounded-xl p-4 text-center border border-cyan-500/20">
                <div class="text-2xl font-bold text-cyan-400" id="statMastered">0</div>
                <div class="text-xs text-slate-400">已掌握</div>
            </div>
            <div class="bg-slate-800/50 rounded-xl p-4 text-center border border-cyan-500/20">
                <div class="text-2xl font-bold text-cyan-400" id="statStreak">0</div>
                <div class="text-xs text-slate-400">连对</div>
            </div>
        </div>

        <div class="flex justify-center gap-2 mb-8 p-1 bg-slate-800 rounded-full w-fit mx-auto border border-cyan-500/30">
            <button onclick="setMode('flashcard')" class="mode-tab px-6 py-2 rounded-full font-medium transition-all bg-cyan-500 text-white" data-mode="flashcard">闪卡</button>
            <button onclick="setMode('quiz')" class="mode-tab px-6 py-2 rounded-full font-medium transition-all text-slate-300 hover:text-white" data-mode="quiz">测验</button>
            <button onclick="setMode('browse')" class="mode-tab px-6 py-2 rounded-full font-medium transition-all text-slate-300 hover:text-white" data-mode="browse">元素库</button>
        </div>

        <div id="flashcardMode" class="mode-content">
            <div class="card-container mb-6">
                <div class="card" id="flashcard" onclick="flipCard()">
                    <div class="card-face">
                        <span class="absolute top-6 right-6 text-sm text-cyan-400" id="elementNumber">1</span>
                        <div class="element-symbol" id="elementSymbol">H</div>
                        <h2 class="text-2xl font-bold text-white mb-2" id="elementName">Hydrogen</h2>
                        <p class="text-cyan-400" id="elementCategory">非金属</p>
                        <span class="absolute bottom-6 text-slate-500 text-sm">点击翻转</span>
                    </div>
                    <div class="card-face card-back">
                        <span class="absolute top-6 right-6 text-sm text-cyan-400" id="elementNumberBack">1</span>
                        <h3 class="text-3xl font-bold text-white mb-2" id="elementNameBack">氢</h3>
                        <p class="text-cyan-400 mb-4" id="elementPinyin">qīng</p>
                        <div class="grid grid-cols-2 gap-4 text-center w-full max-w-sm">
                            <div class="bg-slate-800/50 rounded-lg p-3">
                                <div class="text-xs text-slate-400">原子量</div>
                                <div class="text-lg font-bold text-cyan-400" id="elementMass">1.008</div>
                            </div>
                            <div class="bg-slate-800/50 rounded-lg p-3">
                                <div class="text-xs text-slate-400">电子排布</div>
                                <div class="text-lg font-bold text-cyan-400" id="elementConfig">1s¹</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="ratingButtons" class="hidden flex justify-center gap-3 mb-6">
                <button onclick="rateCard('again')" class="rating-btn">重来</button>
                <button onclick="rateCard('hard')" class="rating-btn">困难</button>
                <button onclick="rateCard('good')" class="rating-btn">良好</button>
                <button onclick="rateCard('easy')" class="rating-btn">简单</button>
            </div>

            <div class="flex justify-center items-center gap-6">
                <button onclick="prevCard()" class="w-12 h-12 rounded-full bg-slate-800 border border-cyan-500/30 flex items-center justify-center text-cyan-400 hover:bg-cyan-500/20">←</button>
                <span class="text-slate-400 font-medium" id="cardProgress">1 / 20</span>
                <button onclick="nextCard()" class="w-12 h-12 rounded-full bg-slate-800 border border-cyan-500/30 flex items-center justify-center text-cyan-400 hover:bg-cyan-500/20">→</button>
            </div>

            <div class="mt-8">
                <div class="h-2 bg-slate-800 rounded-full overflow-hidden border border-cyan-500/20">
                    <div class="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full transition-all" id="progressBar" style="width: 5%"></div>
                </div>
            </div>
        </div>

        <div id="quizMode" class="mode-content hidden">
            <div class="bg-slate-800/50 rounded-2xl p-6 border border-cyan-500/20 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-sm text-cyan-400" id="quizCategory">非金属</span>
                    <span class="text-sm text-slate-400" id="quizProgress">1 / 20</span>
                </div>
                <div class="text-center mb-6">
                    <div class="text-5xl font-bold text-cyan-400 mb-2" id="quizSymbol">H</div>
                    <p class="text-slate-300" id="quizQuestion">这个元素的中文名称是什么？</p>
                </div>
                <div class="space-y-3" id="quizOptions"></div>
            </div>
        </div>

        <div id="browseMode" class="mode-content hidden">
            <div class="grid grid-cols-4 sm:grid-cols-5 gap-3" id="elementGrid"></div>
        </div>
    </div>

    <script>
        // 使用反引号(`)包裹字符串，可安全包含中文引号
        const elements = [
            { number: 1, symbol: "H", name: `氢`, pinyin: "qīng", enName: "Hydrogen", mass: "1.008", config: "1s¹", category: `非金属` },
            { number: 2, symbol: "He", name: `氦`, pinyin: "hài", enName: "Helium", mass: "4.003", config: "1s²", category: `稀有气体` },
            { number: 3, symbol: "Li", name: `锂`, pinyin: "lǐ", enName: "Lithium", mass: "6.941", config: "[He] 2s¹", category: `碱金属` },
            { number: 4, symbol: "Be", name: `铍`, pinyin: "pí", enName: "Beryllium", mass: "9.012", config: "[He] 2s²", category: `碱土金属` },
            { number: 5, symbol: "B", name: `硼`, pinyin: "péng", enName: "Boron", mass: "10.811", config: "[He] 2s² 2p¹", category: `类金属` },
            { number: 6, symbol: "C", name: `碳`, pinyin: "tàn", enName: "Carbon", mass: "12.011", config: "[He] 2s² 2p²", category: `非金属` },
            { number: 7, symbol: "N", name: `氮`, pinyin: "dàn", enName: "Nitrogen", mass: "14.007", config: "[He] 2s² 2p³", category: `非金属` },
            { number: 8, symbol: "O", name: `氧`, pinyin: "yǎng", enName: "Oxygen", mass: "15.999", config: "[He] 2s² 2p⁴", category: `非金属` },
            { number: 9, symbol: "F", name: `氟`, pinyin: "fú", enName: "Fluorine", mass: "18.998", config: "[He] 2s² 2p⁵", category: `卤素` },
            { number: 10, symbol: "Ne", name: `氖`, pinyin: "nǎi", enName: "Neon", mass: "20.180", config: "[He] 2s² 2p⁶", category: `稀有气体` },
            { number: 11, symbol: "Na", name: `钠`, pinyin: "nà", enName: "Sodium", mass: "22.990", config: "[Ne] 3s¹", category: `碱金属` },
            { number: 12, symbol: "Mg", name: `镁`, pinyin: "měi", enName: "Magnesium", mass: "24.305", config: "[Ne] 3s²", category: `碱土金属` },
            { number: 13, symbol: "Al", name: `铝`, pinyin: "lǚ", enName: "Aluminum", mass: "26.982", config: "[Ne] 3s² 3p¹", category: `贫金属` },
            { number: 14, symbol: "Si", name: `硅`, pinyin: "guī", enName: "Silicon", mass: "28.086", config: "[Ne] 3s² 3p²", category: `类金属` },
            { number: 15, symbol: "P", name: `磷`, pinyin: "lín", enName: "Phosphorus", mass: "30.974", config: "[Ne] 3s² 3p³", category: `非金属` },
            { number: 16, symbol: "S", name: `硫`, pinyin: "liú", enName: "Sulfur", mass: "32.065", config: "[Ne] 3s² 3p⁴", category: `非金属` },
            { number: 17, symbol: "Cl", name: `氯`, pinyin: "lǜ", enName: "Chlorine", mass: "35.453", config: "[Ne] 3s² 3p⁵", category: `卤素` },
            { number: 18, symbol: "Ar", name: `氩`, pinyin: "yà", enName: "Argon", mass: "39.948", config: "[Ne] 3s² 3p⁶", category: `稀有气体` },
            { number: 19, symbol: "K", name: `钾`, pinyin: "jiǎ", enName: "Potassium", mass: "39.098", config: "[Ar] 4s¹", category: `碱金属` },
            { number: 20, symbol: "Ca", name: `钙`, pinyin: "gài", enName: "Calcium", mass: "40.078", config: "[Ar] 4s²", category: `碱土金属` }
        ];

        let currentIndex = 0;
        let isFlipped = false;
        let currentMode = 'flashcard';
        let progress = {};
        let streak = 0;

        function init() {
            renderCard();
            updateTabs();
        }

        function updateTabs() {
            document.querySelectorAll('.mode-tab').forEach(tab => {
                if (tab.dataset.mode === currentMode) {
                    tab.classList.add('bg-cyan-500', 'text-white');
                    tab.classList.remove('text-slate-300');
                } else {
                    tab.classList.remove('bg-cyan-500', 'text-white');
                    tab.classList.add('text-slate-300');
                }
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(mode + 'Mode').classList.remove('hidden');
            updateTabs();
            
            if (mode === 'quiz') renderQuiz();
            if (mode === 'browse') renderBrowse();
        }

        function renderCard() {
            const el = elements[currentIndex];
            document.getElementById('elementNumber').textContent = el.number;
            document.getElementById('elementNumberBack').textContent = el.number;
            document.getElementById('elementSymbol').textContent = el.symbol;
            document.getElementById('elementName').textContent = el.enName;
            document.getElementById('elementNameBack').textContent = el.name;
            document.getElementById('elementPinyin').textContent = el.pinyin;
            document.getElementById('elementCategory').textContent = el.category;
            document.getElementById('elementMass').textContent = el.mass;
            document.getElementById('elementConfig').textContent = el.config;
            document.getElementById('cardProgress').textContent = `${currentIndex + 1} / ${elements.length}`;
            
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('ratingButtons').classList.add('hidden');
            
            const pct = ((currentIndex + 1) / elements.length) * 100;
            document.getElementById('progressBar').style.width = pct + '%';
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
            document.getElementById('ratingButtons').classList.toggle('hidden', !isFlipped);
        }

        function rateCard(rating) {
            const el = elements[currentIndex];
            progress[el.symbol] = rating;
            
            if (rating === 'good' || rating === 'easy') streak++;
            else streak = 0;
            
            nextCard();
            updateStats();
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % elements.length;
            renderCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + elements.length) % elements.length;
            renderCard();
        }

        function updateStats() {
            const learned = Object.keys(progress).length;
            const mastered = Object.values(progress).filter(r => r === 'good' || r === 'easy').length;
            
            document.getElementById('statLearned').textContent = learned;
            document.getElementById('statMastered').textContent = mastered;
            document.getElementById('statStreak').textContent = streak;
        }

        function renderQuiz() {
            const el = elements[currentIndex];
            document.getElementById('quizSymbol').textContent = el.symbol;
            document.getElementById('quizCategory').textContent = el.category;
            document.getElementById('quizProgress').textContent = `${currentIndex + 1} / ${elements.length}`;
            
            const wrong = elements
                .filter((_, i) => i !== currentIndex)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(e => e.name);
            
            const options = [el.name, ...wrong].sort(() => Math.random() - 0.5);
            
            document.getElementById('quizOptions').innerHTML = options.map(opt => 
                `<button class="quiz-option w-full" onclick="selectQuiz('${opt}', '${el.name}')">${opt}</button>`
            ).join('');
        }

        function selectQuiz(selected, correct) {
            const buttons = document.querySelectorAll('.quiz-option');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correct) btn.classList.add('correct');
                else if (btn.textContent === selected) btn.classList.add('wrong');
            });
            
            if (selected === correct) streak++;
            else streak = 0;
            
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % elements.length;
                renderQuiz();
                updateStats();
            }, 1500);
        }

        function renderBrowse() {
            const grid = document.getElementById('elementGrid');
            grid.innerHTML = elements.map((el, i) => `
                <div class="aspect-square bg-slate-800/50 rounded-lg border border-cyan-500/20 flex flex-col items-center justify-center cursor-pointer hover:border-cyan-500/50 hover:bg-slate-700/50 transition-all" onclick="jumpTo(${i})">
                    <span class="text-xs text-slate-400">${el.number}</span>
                    <span class="text-xl font-bold text-cyan-400">${el.symbol}</span>
                    <span class="text-xs text-slate-300">${el.name}</span>
                </div>
            `).join('');
        }

        function jumpTo(index) {
            currentIndex = index;
            setMode('flashcard');
            renderCard();
        }

        document.addEventListener('keydown', (e) => {
            if (currentMode !== 'flashcard') return;
            if (e.code === 'Space') { e.preventDefault(); flipCard(); }
            else if (e.code === 'ArrowRight') nextCard();
            else if (e.code === 'ArrowLeft') prevCard();
        });

        init();
    </script>
</body>
</html>
