<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 23 313 341" role="img" aria-labelledby="title desc">
  <title id="title">BioBuddy Icon — DNA Helix + Protein Ribbons (Clean B, No Antibody)</title>
  <desc id="desc">BioBuddy mark: a forward-moving capital B (skewed -7°) with a DNA double-helix stem carrying four evenly-spaced base-pair rungs, interlaced protein-folding ribbons (upper and lower bulges in blue/cyan gradients), and a green ligand at upper-right. The B icon is the clean version without any antibody iconography embedded.</desc>
  <defs>
    <radialGradient id="ambBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5AA9FF" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#4A90F0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4A90F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E0D8" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#00C9C8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00C9C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3CE0B0" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#20D6A2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#20D6A2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dnaDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4FA0"/>
      <stop offset="0.5" stop-color="#071D49"/>
      <stop offset="1" stop-color="#050E2C"/>
    </linearGradient>
    <linearGradient id="dnaCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CF4EA"/>
      <stop offset="0.5" stop-color="#00C9C8"/>
      <stop offset="1" stop-color="#009A9D"/>
    </linearGradient>
    <linearGradient id="ribbonBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FB0FF"/>
      <stop offset="0.55" stop-color="#006EFF"/>
      <stop offset="1" stop-color="#00B7D9"/>
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E72E8"/>
      <stop offset="0.55" stop-color="#0052D9"/>
      <stop offset="1" stop-color="#00A0B8"/>
    </linearGradient>
    <linearGradient id="rung" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#006EFF"/>
      <stop offset="1" stop-color="#00C9C8"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#C2FFE9"/>
      <stop offset="0.45" stop-color="#35D8A9"/>
      <stop offset="1" stop-color="#0C9A70"/>
    </radialGradient>
  </defs>
  <circle cx="240" cy="150" r="130" fill="url(#ambBlue)"/>
  <circle cx="170" cy="220" r="115" fill="url(#ambCyan)"/>
  <circle cx="290" cy="130" r="75" fill="url(#ambGreen)"/>

<g transform="translate(37 43) skewX(-7) scale(0.78)">
    <!-- 深蓝链（底层） -->
    <path d="M96.50 63.00C95.98 78.22 114.19 93.44 134.50 108.67C154.81 123.89 173.02 139.11 172.50 154.33C173.02 169.56 154.81 184.78 134.50 200.00C114.19 215.22 95.98 230.44 96.50 245.67C95.98 260.89 114.19 276.11 134.50 291.33C154.81 306.56 173.02 321.78 172.50 337.00" fill="none" stroke="#071D49" stroke-opacity="0.14" stroke-width="52" stroke-linecap="round"/>
