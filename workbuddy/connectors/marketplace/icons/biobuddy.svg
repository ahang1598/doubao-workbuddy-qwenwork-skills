        <path d="M96.51 245L172.49 245"/>
        <path d="M162.13 315L106.87 315"/>
      </g>
    </g>
    <g>
      <circle cx="107.78" cy="86" r="7" fill="#00C9C8" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="161.22" cy="86" r="7" fill="#00C9C8" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="172.49" cy="155" r="7" fill="#00C9C8" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="96.51" cy="155" r="7" fill="#00C9C8" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="96.51" cy="245" r="7" fill="#00C9C8" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="172.49" cy="245" r="7" fill="#00C9C8" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="162.13" cy="315" r="7" fill="#00C9C8" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="106.87" cy="315" r="7" fill="#00C9C8" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>

    <!-- 上鼓包蛋白丝带 -->
    <path d="M139 74C241 35 347 62 347 144C347 205 290 225 170 215" fill="none" stroke="#006EFF" stroke-opacity="0.15" stroke-width="94" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M139 74C241 35 347 62 347 144C347 205 290 225 170 215" fill="none" stroke="url(#ribbonBlue)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M139 74C241 35 347 62 347 144C347 205 290 225 170 215" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 下鼓包蛋白丝带 -->
    <path d="M122 185C260 172 369 219 369 284C369 356 252 380 139 329" fill="none" stroke="#0052D9" stroke-opacity="0.15" stroke-width="94" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M122 185C260 172 369 219 369 284C369 356 252 380 139 329" fill="none" stroke="url(#ribbonDark)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M122 185C260 172 369 219 369 284C369 356 252 380 139 329" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

