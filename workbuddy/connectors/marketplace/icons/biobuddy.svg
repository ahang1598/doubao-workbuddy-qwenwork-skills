    <path d="M172.50 63.00C173.02 78.22 154.81 93.44 134.50 108.67C114.19 123.89 95.98 139.11 96.50 154.33C95.98 169.56 114.19 184.78 134.50 200.00C154.81 215.22 173.02 230.44 172.50 245.67C173.02 260.89 154.81 276.11 134.50 291.33C114.19 306.56 95.98 321.78 96.50 337.00" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="4.5" stroke-linecap="round"/>

    <!-- 深蓝覆盖段（交叉点2，深蓝在前） -->
    <path d="M153.25 185.00C141.89 195.00 127.11 205.00 115.75 215.00" fill="none" stroke="url(#dnaDark)" stroke-width="27" stroke-linecap="round"/>
    <path d="M153.25 185.00C141.89 195.00 127.11 205.00 115.75 215.00" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>

    <!-- 碱基横杠：4 根，白色底衬 + 渐变主体，端点核苷酸珠 -->
