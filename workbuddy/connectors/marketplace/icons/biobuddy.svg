    <path d="M96.50 63.00C95.98 78.22 114.19 93.44 134.50 108.67C154.81 123.89 173.02 139.11 172.50 154.33C173.02 169.56 154.81 184.78 134.50 200.00C114.19 215.22 95.98 230.44 96.50 245.67C95.98 260.89 114.19 276.11 134.50 291.33C154.81 306.56 173.02 321.78 172.50 337.00" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>

