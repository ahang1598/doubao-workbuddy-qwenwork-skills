# 银行配置文件
# 定义对标银行组、样本组 和 各行品牌视觉资产（brand_identity）
#
# ⚠️ brand_identity 的用途：
#   - `primary` / `accent` 是官方或年报高饱和度主色（已做 2026-04 交叉校验）
#   - `logo_reference` 记录 LOGO 首要来源（用于可追溯），真实 LOGO 由 VIS 资产构建器
#     从年报 PDF 封面提取为 `~/RetailAnalysis/report_assets/by_bank/<bank>/logo/logo.png`
#   - 品牌色与 LOGO 的"在现场再提取" 由 shared/pdf-report-builder-runtime/scripts/
#     bank_vis_builder.py 执行，提取结果需与 `primary_official` 交叉验证
#   - 2015 年起的长期对标分析以 7 家头部股份制银行为核心，光大/民生已纳入默认组
#
# ⚠️ 基准行由用户在运行时指定，本文件不设默认基准行

