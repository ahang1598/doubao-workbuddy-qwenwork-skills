# ---------------------------------------------------------------------------
# 默认分析材料范围
# ---------------------------------------------------------------------------
report_types:
  required:
    - name: 年度报告
      priority: 1
      description: 最核心数据来源
    - name: 半年度报告
      priority: 2
      description: 阶段性经营分析

  optional:
    - name: 一季度报告
      priority: 3
      description: 趋势跟踪
    - name: 三季度报告
      priority: 4
      description: 年内趋势跟踪
    - name: 业绩发布会PPT
      priority: 5
      description: 管理层口径和战略表述重要来源
    - name: 投资者交流纪要
      priority: 6
      description: 补充管理层解释
    - name: 年度业绩公告
      priority: 7
      description: 港股或A+H股银行补充材料
    - name: 监管公告
      priority: 8
      description: 补充合规披露信息
