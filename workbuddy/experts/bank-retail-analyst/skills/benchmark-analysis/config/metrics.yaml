    scope: 表格
    valid_range: { min: 0, max: 5000000 }

  - standard_name: 个人存款-合计-时点余额
    category: 零售存款
    unit: 百万元
    synonyms: [个人存款余额, 零售存款余额, 储蓄存款]
    scope: 表格
    valid_range: { min: 0, max: 8000000 }

  - standard_name: 个人存款-活期-平均余额
    category: 零售存款
    unit: 百万元
    synonyms: [个人活期存款日均余额]
    scope: 表格
    valid_range: { min: 0, max: 5000000 }

  - standard_name: 个人存款-定期-平均余额
    category: 零售存款
    unit: 百万元
    synonyms: [个人定期存款日均余额]
    scope: 表格
    valid_range: { min: 0, max: 5000000 }

  - standard_name: 个人存款-合计-平均余额
    category: 零售存款
    unit: 百万元
    synonyms: [个人存款日均余额]
    scope: 表格
    valid_range: { min: 0, max: 8000000 }

  - standard_name: 个人存款成本率
    category: 零售存款
    unit: "%"
    synonyms: [零售存款平均成本率, 个人存款利率]
    scope: 表格
    valid_range: { min: 0, max: 5 }

  - standard_name: 个人存款成本率-本行口径
