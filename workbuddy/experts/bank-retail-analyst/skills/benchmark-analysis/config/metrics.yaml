# 指标字典 - 适配新 Skill 架构
# Skill 1（标准数据提取器）和 Skill 2（文字数据提取器）共用此指标字典
# 分为两大部分：表格类标准指标（Skill 1）和文字类指标（Skill 2）

# ============================================================
# 第一部分：表格类标准指标（Skill 1 使用）
# ============================================================

# --- ① 效益类指标（分部报告）---
segment_report_metrics:
  # -- 零售分部 --
  - standard_name: 零售分部营业净收入
    category: 分部报告-零售
    unit: 百万元
    description: 零售金融/零售银行分部的营业净收入
    synonyms:
      - 零售银行业务-营业净收入
      - 零售金融业务-营业收入
      - 个人银行业务-营业净收入
      - 个人金融-营业净收入
    scope: 表格
    valid_range: { min: 0, max: 300000 }

  - standard_name: 零售分部利息净收入
    category: 分部报告-零售
    unit: 百万元
    description: 零售分部利息净收入（含内部/外部）
    synonyms:
      - 零售银行业务-利息净收入
      - 零售金融-利息净收入
      - 个人银行业务-利息净收入
