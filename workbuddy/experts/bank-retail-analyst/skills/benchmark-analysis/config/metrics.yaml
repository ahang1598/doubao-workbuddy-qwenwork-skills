# --- ④ 零售贷款资产质量 ---
retail_asset_quality_metrics:
  # 第一类：信用卡
  - standard_name: 信用卡-不良贷款额
    category: 资产质量-信用卡
    unit: 百万元
    synonyms: [信用卡不良贷款余额, 信用卡不良余额]
    scope: 表格
    valid_range: { min: 0, max: 100000 }

  - standard_name: 信用卡-不良贷款率
    category: 资产质量-信用卡
    unit: "%"
    synonyms: [信用卡不良率, 信用卡不良贷款率]
    scope: 表格
    valid_range: { min: 0, max: 15 }

  # 第二类：非信用卡（按细项）
  - standard_name: 住房按揭-不良贷款额
    category: 资产质量-非信用卡
    unit: 百万元
    scope: 表格
    valid_range: { min: 0, max: 50000 }

  - standard_name: 住房按揭-不良贷款率
    category: 资产质量-非信用卡
    unit: "%"
    scope: 表格
    valid_range: { min: 0, max: 5 }

  - standard_name: 消费贷-不良贷款额
    category: 资产质量-非信用卡
    unit: 百万元
    scope: 表格
    valid_range: { min: 0, max: 50000 }

  - standard_name: 消费贷-不良贷款率
    category: 资产质量-非信用卡
    unit: "%"
    scope: 表格
    valid_range: { min: 0, max: 10 }

  - standard_name: 经营贷-不良贷款额
    category: 资产质量-非信用卡
    unit: 百万元
    scope: 表格
    valid_range: { min: 0, max: 50000 }

  - standard_name: 经营贷-不良贷款率
    category: 资产质量-非信用卡
    unit: "%"
    scope: 表格
    valid_range: { min: 0, max: 10 }

  # 合计
  - standard_name: 个人贷款-合计-不良贷款额
    category: 资产质量-合计
    unit: 百万元
    synonyms: [零售贷款不良贷款余额]
    scope: 表格
    valid_range: { min: 0, max: 200000 }

  - standard_name: 个人贷款-合计-不良贷款率
    category: 资产质量-合计
    unit: "%"
    synonyms: [个人贷款不良率, 零售贷款不良率]
    scope: 表格
    valid_range: { min: 0, max: 10 }
    calibration_note: |
      【口径警示】中信等银行在『按产品划分的贷款集中度表』中披露的"个人贷款不良率"为『含信用卡』口径；
      但MD&A或同业对标表中经常出现『不含信用卡』口径。两个口径可差异 0.2-0.5pct。
      Skill4如需对标，建议派生计算：
        个人贷款-不含信用卡-不良贷款率 = (个人贷款合计不良额 - 信用卡不良额) / (个人贷款合计余额 - 信用卡贷款余额)
      或直接使用"个人贷款-不含信用卡-不良贷款率"（见下）。

  - standard_name: 个人贷款-不含信用卡-不良贷款率
    category: 资产质量-合计
    unit: "%"
    synonyms:
      - 个人贷款(不含信用卡)不良率
      - 非信用卡个人贷款不良率
      - 零售非信用卡贷款不良率
    scope: 文字  # 多数银行只在MD&A文字中披露或需要派生计算
    valid_range: { min: 0, max: 8 }
    calibration_note: |
      大多数银行不直接披露此指标，需要从其他数据派生：
        = (个人贷款合计不良额 - 信用卡不良额) / (个人贷款合计余额 - 信用卡贷款余额)
      派生时请注意口径一致性（集团/本行）。

