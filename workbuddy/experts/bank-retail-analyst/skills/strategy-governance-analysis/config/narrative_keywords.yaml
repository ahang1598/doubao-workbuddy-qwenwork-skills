# 叙事分析关键词词表
# 用于第二阶段 2.1 叙事提取 + 2.2 动量校验
#
# 结构：
#   keyword_groups.<战略主题>.keywords       : 扫描关键词（含同义词变体）
#   keyword_groups.<战略主题>.pair_resource  : 对应的资源指标（用于言行比对，名称需能映射到 benchmark_database.json 或 standard/text JSON 字段）

keyword_groups:
  # =========================================================
  # 零售战略族
  # =========================================================
  零售优先:
    keywords:
      - 零售优先
      - 零售转型
      - 大零售
      - 大财富
      - 零售立行
      - 零售银行战略
      - 大零售战略
    pair_resource:
      - 零售贷款占比            # 来自 standard 分部报告
      - 零售营收占全行营收占比
      - 零售存款占比
    pair_intensity_resource:
      - 零售信贷同比增速
      - 财富管理收入同比增速

  财富管理:
    keywords:
      - 大财富管理
      - 财富管理
      - 私行业务
      - 高净值
      - 资产配置
      - 开放平台
    pair_resource:
      - 零售AUM
      - 财富管理收入
      - 私行AUM
      - 私行客户数

  信用卡:
    keywords:
      - 信用卡
      - 精益信用卡
      - 卡业务
      - 信用卡经营
    pair_resource:
      - 信用卡流通卡量
      - 信用卡交易量
      - 信用卡贷款余额
      - 信用卡不良率      # 反向配对：如果强调"精细经营"，不良率应下行

  # =========================================================
  # 科技战略族
  # =========================================================
  科技驱动:
    keywords:
      - 科技引领
      - 数字化转型
      - 金融科技
      - 科技赋能
      - 数字化银行
      - AI银行
    pair_resource:
      - 科技投入               # 常来自年报"信息科技投入"表
      - 科技投入占营收比
      - 科技人员占比

  # =========================================================
  # 风险战略族
  # =========================================================
  风险优先:
    keywords:
      - 风险优先
      - 守住底线
      - 稳健经营
      - 以质取胜
      - 资产质量稳中向好
      - 风险合规先行
    pair_resource:
      - 拨备覆盖率
      - 信用成本
      - 不良新生成率
      - 核心一级资本充足率

  # =========================================================
  # 综合金融与商投一体
  # =========================================================
  综合金融:
    keywords:
      - 综合金融
      - 协同经营
      - 集团协同
      - 商投一体
      - 商行+投行
    pair_resource:
      - 对公FPA
      - 投行发行规模
      - 综合金融收入

  # =========================================================
  # 绿色金融 / ESG
  # =========================================================
  绿色金融:
    keywords:
      - 绿色金融
      - 双碳
      - ESG
      - 可持续
      - 绿色信贷
    pair_resource:
      - 绿色信贷余额
      - ESG披露完整度

  # =========================================================
  # 普惠金融
  # =========================================================
  普惠小微:
    keywords:
      - 普惠金融
      - 小微金融
      - 普惠小微
      - 支持实体
    pair_resource:
      - 普惠小微贷款余额
      - 普惠小微贷款户数

  # =========================================================
  # 国际化 / 一带一路
  # =========================================================
  国际化:
    keywords:
      - 国际化
      - 走出去
      - 一带一路
      - 跨境业务
    pair_resource:
      - 境外营收占比
      - 跨境业务量

# =========================================================
# 分析参数
# =========================================================
analysis_params:
  # 第二阶段 2.2 动量校验：相关系数 ρ 的滑动窗口
  correlation_window_years: 3

  # 第二阶段 2.3 偏离度计算：计算新任领导上任前 3 年的关键词漂移率
  leader_transition_window_years: 3

  # 判定阈值
  thresholds:
    true_strategy_rho: 0.6           # ρ ≥ 0.6 判为真战略
    slogan_strategy_rho_low: 0.0     # 0 ≤ ρ < 0.6 判为口号型
    propaganda_rho_max: 0.0          # ρ < 0 判为宣传话术
    inheritance_overlap: 0.7         # 核心词沿用 ≥ 70% 判"进化式继承"
    incremental_overlap_low: 0.3     # 30% ≤ 沿用 < 70% 判"渐进式调整"
    # 沿用 < 30% 判"换届式创新"（默认）
