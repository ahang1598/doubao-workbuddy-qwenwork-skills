# 历任董事长 / 行长画像
#
# 数据来源：各行历年年度报告"董事会成员简历 / 高级管理人员简历"章节 +
#           公司重大人事变动公告（均为公开披露信息），并于 2026-04 联网核验。
# 覆盖时间：约 2004 年至 2026-04
# 核验要点：所有任期经 Sohu/新浪财经/财新/第一财经/百度百科/百度快懂/
#           招商局官网/平安官网/巨潮资讯上市公司公告 交叉印证。
# 维护规则：新任免时增量维护，每次修改须在 note 中注明"<行名> YYYY 年年报"
#           或"<媒体> YYYY-MM-DD" 来源。
#
# 字段说明：
#   role                : 董事长 / 行长 / 执行董事（可按需扩展）
#   name                : 姓名（中文全名）
#   tenure_start        : 任期起点 YYYY-MM
#   tenure_end          : 任期止点 YYYY-MM；在任者用 "present"
#   background          : 背景类型，枚举：
#                           internal  = 在本行内部晋升（>=5 年内部任职）
#                           system    = 母集团 / 兄弟行 / 兄弟金融机构调任
#                           regulator = 监管 / 央行 / 外管出身
#                           external  = 其他商业银行 / 完全外部空降
#   prior_roles         : 上任前核心履历（≤3 条，用于判断风险偏好与经验底色）
#   cross_cycle         : 任期是否跨越 cycles.yaml 中 2+ 个周期（布尔）
#   cycles_covered      : 任期覆盖到的周期 id 列表（cycle1~cycle5）
#   strategic_signature : 上任时对外宣讲的核心战略口号（2~4 个关键词）
#   note                : 关键背景注释（外部空降原因 / 监管履历 / 风险事件关联等）

