# 战略韧性评分规则（满分 100）
# 对应 SKILL.md § 第四阶段 4.3 战略韧性评分

total_score: 100

dimensions:
  # =============================================================
  # 维度 1：高管稳定性（30 分）
  # =============================================================
  leader_stability:
    weight: 30
    rules:
      - metric: 董事长平均任期年数
        type: threshold_scale
        scale:
          "<3":  0
          "3-5": 10
          "5-8": 20
          ">=8": 30
      - metric: 行长平均任期年数
        type: threshold_scale
        scale:
          "<3":  0
          "3-5": 8
          "5-8": 16
          ">=8": 25
      - metric: 跨周期覆盖率  # 跨周期任期数 / 总任期数
        type: threshold_scale
        scale:
          "<0.3":   0
          "0.3-0.5": 10
          "0.5-0.7": 20
          ">=0.7":  30
    merge: weighted_avg
    subweights: [0.4, 0.3, 0.3]

  # =============================================================
  # 维度 2：组织惯性（30 分）
  # =============================================================
  org_inertia:
    weight: 30
    rules:
      - metric: 一级部室平均存续年限（近 10 年）
        type: threshold_scale
        scale:
          "<3":   0
          "3-6":  10
          "6-10": 20
          ">=10": 30
      - metric: 零售条线稳定性（近 5 年一级部室变动次数）
        type: inverse_threshold_scale  # 变动次数越少得分越高
        scale:
          "0": 30
          "1": 20
          "2": 10
          ">=3": 0
      - metric: 科技条线稳定性（近 5 年一级部室变动次数）
        type: inverse_threshold_scale
        scale:
          "0": 25
          "1": 18
          "2": 10
          ">=3": 0
      - metric: 风险条线稳定性（近 5 年一级部室变动次数）
        type: inverse_threshold_scale
        scale:
          "0": 25
          "1": 18
          "2": 10
          ">=3": 0
    merge: weighted_avg
    subweights: [0.3, 0.3, 0.2, 0.2]

  # =============================================================
  # 维度 3：政策适配度（20 分）
  # =============================================================
  # 来源：第三阶段 3.2 "差异化逻辑识别" 对每家行每个关键节点的判断
  # 对 N 个关键节点的决策判定（领先 / 跟随 / 滞后）取加权均值
  policy_fit:
    weight: 20
    source: phase3.decision_logic
    node_scoring:
      领先: 20
      早期跟随: 15
      跟随: 12
      滞后跟随: 8
      滞后: 5
      相反: 0
    node_weights:  # 权重与节点重要性有关
      2013_qianhuang:      0.15
      2016_mpa:            0.15
      2018_asset_new_rules: 0.25
      2020_covid:          0.20
      2022_real_estate:    0.25

  # =============================================================
  # 维度 4：言行一致度（20 分）
  # =============================================================
  # 来源：第二阶段 2.2 "动量校验" 对所有 "关键词→资源" 配对的 ρ 均值
  narrative_consistency:
    weight: 20
    source: phase2.consistency_matrix
    rules:
      - {avg_rho_gte: 0.6,  score: 20, label: 真战略}
      - {avg_rho_gte: 0.3,  score: 12, label: 口号型}
      - {avg_rho_gte: 0.0,  score: 6,  label: 名义倾斜}
      - {avg_rho_lt:  0.0,  score: 0,  label: 宣传话术}

# =============================================================
# 综合评分等级
# =============================================================
grade_bands:
  - {min: 85, max: 100, grade: "A（战略定力卓越）", color: "#2E7D32"}
  - {min: 70, max: 84,  grade: "B（战略定力良好）", color: "#558B2F"}
  - {min: 55, max: 69,  grade: "C（战略定力一般）", color: "#F9A825"}
  - {min: 40, max: 54,  grade: "D（战略定力偏弱）", color: "#EF6C00"}
  - {min: 0,  max: 39,  grade: "E（战略摇摆风险）", color: "#C62828"}

# =============================================================
# 解读模板（生成报告时可直接调用）
# =============================================================
interpretation_templates:
  leader_stability_high: "{bank} 董事长/行长平均任期 {years} 年，跨 {cycles} 个周期，具备\"一张蓝图绘到底\"的人事基础"
  leader_stability_low:  "{bank} 董事长/行长平均任期仅 {years} 年，跨周期覆盖不足，战略延续性人事基础薄弱"
  org_inertia_high:      "{bank} 一级部室平均存续 {years} 年，零售/科技/风险三条线近 5 年仅变动 {changes} 次，组织惯性有利于战略延续"
  org_inertia_low:       "{bank} 近 5 年一级部室累计变动 {changes} 次，组织重构频繁，易造成战略执行中断"
  policy_fit_high:       "{bank} 在 {node_count} 个关键节点中 {lead_count} 次领先决策，政策适配度显著领先同业"
  policy_fit_low:        "{bank} 关键节点多数滞后跟随，政策适配度弱，存在被动受冲击的治理风险"
  narrative_consistency_high: "{bank} 战略口号与资源投向平均相关性 {rho}，言行一致度高，体现\"说到做到\"的执行力"
  narrative_consistency_low:  "{bank} 战略口号与资源投向平均相关性仅 {rho}，言行存在明显落差，需警惕\"口号型战略\""
