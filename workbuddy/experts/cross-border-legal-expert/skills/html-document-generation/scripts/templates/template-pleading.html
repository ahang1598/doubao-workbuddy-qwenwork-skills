<!doctype html>
<html lang="$lang$" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>$title$</title>
$for(header-includes)$
$header-includes$
$endfor$
</head>
<body>

<main class="pleading-doc">

  <!-- 文书标题（上下双线居中） -->
  <h1 class="pleading-title">$title$</h1>

  <!-- 当事人信息（AI 在 MD 中用 HTML 填充） -->
  $if(parties)$
  <div class="pleading-parties">
    $parties$
  </div>
  $endif$

  $if(disclaimer)$
  <div class="disclaimer"><strong>免责声明</strong>
    <ol><li>本文书仅供参考，不构成正式法律意见。正式法律问题请咨询执业律师。</li></ol></div>
  $endif$

  <!-- 正文（诉讼请求/事实与理由/法律依据） -->
  <div class="pleading-body">
    $body$
  </div>

  <!-- 此致 + 法院 -->
  <div class="pleading-court">
    <p>此致</p>
    <p><strong>$if(court)$$court$$else$——人民法院$endif$</strong></p>
  </div>

  <!-- 具状人/日期 -->
  <div class="pleading-signoff">
    $if(signer)$<div class="signer">具状人：$signer$</div>$endif$
    $if(date)$<div class="date">$date$</div>$endif$
  </div>

  <div class="pleading-seal"><div class="seal-box"></div></div>

</main>

</body>
</html>
