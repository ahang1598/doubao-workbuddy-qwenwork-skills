<!doctype html>
<html lang="$lang$" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>$title$</title>
$for(header-includes)$
$header-includes$
$endfor$
</head>
<body>

<main class="form-doc">

  <!-- 表格标题 -->
  <h1 class="form-title">$title$</h1>
  $if(form-no)$<p class="form-subtitle">$form-no$</p>$endif$

  $if(disclaimer)$
  <div class="disclaimer"><strong>免责声明</strong>
    <ol><li>本表仅供参考，不构成正式法律意见。</li></ol></div>
  $endif$

  <!-- 表格主体（AI 在 MD 中内嵌 HTML 表格） -->
  $body$

  <!-- 填表说明 -->
  $if(form-note)$
  <p class="form-note">$form-note$</p>
  $endif$

  <!-- 签章区 -->
  $if(signer)$
  <div class="form-signoff">
    <div class="col">
      <div class="label">填表人/申请人</div>
      <div class="value">$signer$</div>
      <div class="line"></div>
    </div>
    <div class="col">
      <div class="label">日期</div>
      <div class="value">$date$</div>
      <div class="line"></div>
    </div>
    <div class="col">
      <div class="label">签章</div>
      <div class="value"></div>
      <div class="line"></div>
    </div>
  </div>
  $endif$

</main>

</body>
</html>
