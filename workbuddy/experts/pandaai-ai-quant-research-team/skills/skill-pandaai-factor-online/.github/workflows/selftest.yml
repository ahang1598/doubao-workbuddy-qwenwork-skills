name: Self-test

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 离线自检
        run: python3 scripts/selftest.py
